<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La masse volumique</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F1;
  --paper-2:#FCFCFA;
  --rule:#BFD3E4;
  --rule-soft:#DDE7F0;
  --marge:#DE5B4A;
  --ink:#16233B;
  --ink-soft:#5E6E85;
  --pc:#5F4B8B;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  padding:0 0 40px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- en-tete ---------- */
header{padding:26px 0 14px}
.topbar{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.topbar .eyebrow{margin:0}
.home{
  font-family:var(--sans);font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;padding:6px 12px;background:var(--paper,transparent);
  transition:background .2s,transform .2s
}
.home:hover{background:var(--rule-soft);transform:translateY(-1px)}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;margin:0 0 6px
}
h1{
  font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;
  margin:0 0 4px;letter-spacing:-.01em
}
h1 em{font-style:italic;color:var(--pc)}
.sub{margin:0;color:var(--ink-soft);font-size:14px}

/* ---------- onglets (deux rangees) ---------- */
nav{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 10px}
.tab{
  flex:1 1 31%;border:1px solid var(--rule);
  background:#EDEFE9;color:var(--ink-soft);
  font-family:var(--sans);font-size:12.5px;font-weight:700;
  padding:10px 3px;border-radius:9px;cursor:pointer;
  letter-spacing:.01em;transition:background .15s,color .15s
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper-2);color:var(--ink);box-shadow:inset 0 -2px 0 var(--pc)}

/* ---------- feuille ---------- */
.sheet{
  position:relative;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:10px;
  padding:22px 16px 20px 30px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px);
  background-position:0 8px;
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:20px;width:1px;background:var(--marge);opacity:.5
}
.panel{display:none}
.panel.on{display:block}

/* ---------- barre d'etat ---------- */
.status{
  display:flex;align-items:center;gap:12px;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:14px
}
.status .grow{flex:1}
.status b{color:var(--ink);font-size:14px;letter-spacing:0}

/* ---------- figure ---------- */
.fig{margin:0 0 8px}
.fig svg{width:100%;height:auto;display:block}
.fig .box{fill:var(--paper-2);stroke:var(--ink);stroke-width:1.5}
.fig .boxlab{font:700 13px var(--sans);fill:var(--ink);letter-spacing:.06em}
.fig .fl{stroke:#B9C2CE;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.fig .fl.on{stroke:var(--marge);stroke-width:3}
.fig .axe{stroke:var(--ink);stroke-width:1.5;fill:none;stroke-linecap:round}
.fig .tick{font:700 10px var(--sans);fill:var(--ink-soft)}
.fig .axlab{font:italic 12px var(--serif);fill:var(--ink)}
.fig .guide{stroke:#B9C2CE;stroke-width:1;stroke-dasharray:4 4}
.fig .cw{stroke:var(--pc);stroke-width:2.5;stroke-linecap:round}
.fig .cw.on{stroke:var(--marge);stroke-width:4}
.hyp{font-size:14.5px;margin:0 0 6px}
.hyp em{font-style:normal;font-weight:700}
.annot{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);transition:color .3s ease;margin:0 0 4px
}
.revealed .annot{color:var(--pc)}

.fig .tube{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.fig .liq{fill:#CFE3F2}
.fig .menis{fill:none;stroke:#7FA8CA;stroke-width:1.5}
.fig .solide{fill:var(--pc);opacity:.8}
.fig .loupe{fill:var(--paper-2);stroke:var(--ink);stroke-width:1.5}
.fig .lire{stroke:var(--marge);stroke-width:1.5;stroke-dasharray:5 4}

/* ---------- reactions ---------- */
.react{text-align:center;min-height:78px;margin:0 0 8px;position:relative}
.react .emo{display:inline-block;font-size:48px;line-height:52px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.react .msg{display:block;font-family:var(--sans);font-weight:800;font-size:16px;line-height:22px;letter-spacing:.02em;animation:pop .45s .1s both cubic-bezier(.2,1.6,.4,1)}
.react.yes .msg{color:var(--pc)}
.react.no .msg{color:var(--marge)}
.react.no .emo{animation:shake .5s ease}
.react .streak{display:block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px;animation:pop .4s .25s both}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px) rotate(-8deg)}40%,80%{transform:translateX(8px) rotate(8deg)}}
.confetti{position:absolute;left:50%;top:26px;width:9px;height:9px;border-radius:2px;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.why{font-size:14px;color:var(--ink-soft);margin:8px 0 0;opacity:0;transition:opacity .3s .3s}
.revealed .why{opacity:1}
.why em{font-style:normal;color:var(--ink);font-weight:700}

/* ---------- choix ---------- */
.choices-eq{display:grid;gap:8px;margin-top:16px}
.choices-eq.deux{grid-template-columns:1fr 1fr}
.choice{
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);
  font-family:var(--serif);font-size:17px;
  padding:12px 8px;border-radius:7px;cursor:pointer;text-align:center;
  transition:background .12s,border-color .12s,color .12s,opacity .2s
}
.choice:hover:not(:disabled){border-color:var(--ink);background:#F1F3EE}
.choice:disabled{cursor:default}
.choice.dim{opacity:.32}
.choice.good{background:var(--pc);border-color:var(--pc);color:#fff;opacity:1}
.choice.bad{background:transparent;border-color:var(--marge);color:var(--marge);opacity:1;text-decoration:line-through}

/* ---------- saisie ---------- */
.answer{display:flex;gap:8px;align-items:center;margin-top:16px}
.answer input{
  flex:1;min-width:0;border:1px solid var(--rule);border-radius:8px;padding:12px;
  font-family:var(--sans);font-size:18px;background:var(--paper-2);color:var(--ink)
}
.answer input:disabled{opacity:.6}
.answer .unit{font-weight:700;color:var(--ink-soft)}

/* ---------- boutons ---------- */
.btn{
  display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);
  font-family:var(--sans);font-size:15px;font-weight:700;padding:12px 22px;border-radius:8px;cursor:pointer;
  transition:opacity .15s
}
.btn:hover{opacity:.86}
.btn:disabled{cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;min-height:46px;align-items:center}
.hidden{display:none !important}

/* ---------- accueil de manche ---------- */
.intro{padding:6px 0 4px}
.intro h2{font-family:var(--serif);font-weight:400;font-size:27px;margin:0 0 8px;line-height:1.15}
.intro p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;max-width:44ch}

/* ---------- bilan ---------- */
.bilan h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 2px}
.bigscore{font-family:var(--serif);font-size:56px;line-height:1;margin:10px 0 2px}
.bilan .meta{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
.errlist{border-top:1px solid var(--rule-soft);margin:14px 0 0;padding:0;list-style:none}
.errlist li{border-bottom:1px solid var(--rule-soft);padding:11px 0;font-size:14px;color:var(--ink-soft)}
.errlist .rep{font-weight:700;color:var(--pc)}
.section-title{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  margin:22px 0 0
}

@media (max-width:420px){
  .tab{font-size:11.5px;letter-spacing:0}
}
@media (max-width:360px){
  .choice{font-size:15px}
  .tab{font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--pc);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar"><a class="home" href="physique-chimie.html">🏠 Physique-Chimie</a><p class="eyebrow">Physique-Chimie, 3<sup>e</sup></p></div>
    <h1>Chaque matière a sa <em>masse volumique</em></h1>
    <p class="sub">Cinq entraînements : la formule, la mesure d'un volume, les unités, l'identification d'un métal, flotter ou couler.</p>
    <nav role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-panel="formule">La formule</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="mesurer">Mesurer</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="unites">Les unités</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="identifier">Identifier</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="flotter">Flotter ou couler</button>
    </nav>
  </header>

  <div class="sheet">
    <section class="panel on" id="formule"></section>
    <section class="panel" id="mesurer"></section>
    <section class="panel" id="unites"></section>
    <section class="panel" id="identifier"></section>
    <section class="panel" id="flotter"></section>
  </div>
</div>

<script>
/* ============ outils ============ */
const $ = (sel,root=document)=>root.querySelector(sel);
const shuffle = a => {const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function chrono(sec){return sec<60?sec+" s":Math.floor(sec/60)+" min "+String(sec%60).padStart(2,"0");}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const norm=v=>{const l=Math.hypot(v.x,v.y)||1;return{x:v.x/l,y:v.y/l};};

/* ============ moteurs ============ */

/* une ou deux eprouvettes graduees, avec le solide immerge et la loupe sur le menisque.
   La loupe occupe la moitie droite du cadre (x de 206 a 298) : elle ne va donc qu'avec un tube
   unique, decale a gauche pour lui laisser la place. Avec deux tubes, le tube droit passerait
   dessous. Meme prudence avec un niveau nul : le menisque descendrait sous le fond du tube. */
function eprouvette(o){
  const max=o.max||110, tubes=o.tubes, W=54, H=150, Y0=182;
  const xs = tubes.length===1 ? (o.loupe?[104]:[160]) : [92,228];
  const y = v => Y0-(v/max)*H;
  let b="";
  tubes.forEach((t,i)=>{
    const x=xs[i]-W/2, ys=y(t.v);
    b+=`<rect class="liq" x="${x+2}" y="${ys}" width="${W-4}" height="${Y0-ys}"/>`;
    if(t.solide)b+=`<rect class="solide" x="${x+13}" y="${Y0-24}" width="${W-26}" height="21" rx="3"/>`;
    b+=`<path class="menis" d="M ${x+2} ${ys} Q ${xs[i]} ${ys+6} ${x+W-2} ${ys}"/>`;
    b+=`<path class="tube" d="M ${x} ${Y0-H-14} L ${x} ${Y0-8} Q ${x} ${Y0} ${x+8} ${Y0} L ${x+W-8} ${Y0} Q ${x+W} ${Y0} ${x+W} ${Y0-8} L ${x+W} ${Y0-H-14}"/>`;
    for(let v=0;v<=max;v+=10){
      const gros=v%20===0;
      b+=`<line class="axe" x1="${x+W}" x2="${x+W-(gros?11:6)}" y1="${y(v)}" y2="${y(v)}"/>`;
      if(gros&&v>0)b+=`<text class="tick" x="${x+W+4}" y="${y(v)}" dominant-baseline="middle">${v}</text>`;
    }
    b+=`<text class="axlab" x="${xs[i]}" y="205" text-anchor="middle">${t.label}</text>`;
  });
  if(o.loupe){
    const LX=214,LY=44,LW=84,LH=78,surf=LY+30;
    b+=`<rect class="loupe" x="${LX}" y="${LY}" width="${LW}" height="${LH}" rx="12"/>`;
    b+=`<path class="liq" d="M ${LX+3} ${surf} Q ${LX+LW/2} ${surf+15} ${LX+LW-3} ${surf} L ${LX+LW-3} ${LY+LH-3} L ${LX+3} ${LY+LH-3} Z"/>`;
    b+=`<path class="menis" d="M ${LX+3} ${surf} Q ${LX+LW/2} ${surf+15} ${LX+LW-3} ${surf}"/>`;
    b+=`<line class="lire" x1="${LX-8}" x2="${LX+LW+8}" y1="${surf+14}" y2="${surf+14}"/>`;
    b+=`<text class="axlab" x="${LX+LW/2}" y="${LY+LH+18}" text-anchor="middle">on lit ici</text>`;
  }
  return `<svg viewBox="0 0 320 212" role="img" aria-label="Éprouvette graduée">${b}</svg>`;
}

/* ============ donnees ============ */

const METAUX=[
  {nom:"Aluminium",rho:2.7},
  {nom:"Zinc",rho:7.1},
  {nom:"Fer",rho:7.9},
  {nom:"Laiton",rho:8.2},
  {nom:"Cuivre",rho:8.9},
  {nom:"Argent",rho:10.5},
  {nom:"Or",rho:19.3}
];
const LIQUIDES=[
  {nom:"Éthanol",rho:0.8,col:"#E4E0F2"},
  {nom:"Huile",rho:0.9,col:"#F0E2B0"},
  {nom:"Eau",rho:1,col:"#CFE3F2"},
  {nom:"Sirop",rho:1.3,col:"#E9B7A4"}
];
const fr=n=>String(n).replace(".",",");
const liq=nom=>LIQUIDES.find(l=>l.nom===nom);

const FORMULE=[
  {kind:"qcm",q:"Comment calcule-t-on la masse volumique ρ d'un objet ?",ch:["ρ = m ÷ V","ρ = V ÷ m","ρ = m × V"],good:0,rep:"ρ = m ÷ V.",
   w:"La masse volumique est la masse divisée par le volume. Elle s'exprime en g/cm³ (ou en kg/m³)."},
  {kind:"qcm",q:"Une bouteille d'un litre d'eau et une bouteille de deux litres d'eau. Que dire de leur masse volumique ?",ch:["La même : 1 g/cm³ pour les deux","Deux fois plus grande pour la grande bouteille","Deux fois plus grande pour la petite bouteille"],good:0,rep:"La même : 1 g/cm³.",
   w:"La <em>masse</em> dépend de la quantité, la <em>masse volumique</em> non : elle caractérise la matière. Deux litres d'eau pèsent deux fois plus, mais c'est toujours de l'eau, donc toujours 1 g/cm³."},
  {kind:"num",q:"Un pavé de fer a un volume de 10 cm³ et une masse de 79 g. <em>Calcule sa masse volumique, en g/cm³.</em>",ans:7.9,unit:"g/cm³",rep:"ρ = 7,9 g/cm³",
   w:"ρ = m ÷ V = 79 ÷ 10 = <em>7,9 g/cm³</em>. C'est bien la masse volumique du fer."},
  {kind:"num",q:"La masse volumique de l'eau vaut 1 g/cm³. <em>Quelle est la masse de 250 cm³ d'eau, en g ?</em>",ans:250,unit:"g",rep:"m = 250 g",
   w:"m = ρ × V = 1 × 250 = <em>250 g</em>. Avec l'eau, masse en grammes et volume en cm³ ont la même valeur."},
  {kind:"num",q:"La masse volumique de l'huile vaut 0,9 g/cm³. <em>Quelle est la masse de 200 cm³ d'huile, en g ?</em>",ans:180,unit:"g",rep:"m = 180 g",
   w:"m = ρ × V = 0,9 × 200 = <em>180 g</em> : moins lourd que le même volume d'eau (200 g)."},
  {kind:"num",q:"L'aluminium a une masse volumique de 2,7 g/cm³. <em>Quelle est la masse d'un bloc de 30 cm³, en g ?</em>",ans:81,unit:"g",rep:"m = 81 g",
   w:"m = ρ × V = 2,7 × 30 = <em>81 g</em>. Le même bloc en fer (7,9) pèserait 237 g : presque trois fois plus."},
  {kind:"num",q:"La masse volumique du fer vaut 7,9 g/cm³. <em>Quel volume, en cm³, occupent 158 g de fer ?</em>",ans:20,unit:"cm³",rep:"V = 20 cm³",
   w:"V = m ÷ ρ = 158 ÷ 7,9 = <em>20 cm³</em>. La formule se retourne dans les trois sens : ρ = m ÷ V, m = ρ × V, V = m ÷ ρ."},
  {kind:"qcm",q:"Quelle est environ la masse d'un litre d'air ?",ch:["1,3 g","130 g","0 g : un gaz ne pèse rien"],good:0,rep:"Environ 1,3 g.",
   w:"L'air a une masse : environ 1,3 g par litre. C'est peu, mais ce n'est pas rien : un gaz se pèse."}
];

const MESURER=[
  {kind:"qcm",fig:{tubes:[{v:60,label:"éprouvette graduée"}]},q:"Avec quel instrument mesure-t-on précisément le volume d'un liquide ?",ch:["Une éprouvette graduée","Un thermomètre","Une balance"],good:0,rep:"Une éprouvette graduée.",
   w:"Le thermomètre mesure une température, la balance une masse. Pour un volume, c'est l'éprouvette graduée : ses traits sont gradués en mL."},
  {kind:"qcm",fig:{tubes:[{v:60,label:"la surface est incurvée"}],loupe:true},q:"La surface du liquide est incurvée. Où lit-on le volume ?",ch:["Au bas de la courbe, l'œil bien en face","En haut, là où le liquide touche le verre","Au milieu, à vue d'œil"],good:0,rep:"Au bas du ménisque, l'œil en face.",
   w:"Cette courbe s'appelle le <em>ménisque</em>. On lit toujours le trait au bas du ménisque, en plaçant l'œil à sa hauteur : de biais, on lit faux."},
  {kind:"qcm",fig:null,q:"Avant de peser un liquide, on pose l'éprouvette vide sur la balance et on appuie sur « tare ». Pourquoi ?",ch:["Pour que la balance oublie la masse de l'éprouvette","Pour régler la balance en grammes","Pour vérifier le volume"],good:0,rep:"Pour ne peser que le liquide.",
   w:"La tare remet l'affichage à zéro avec l'éprouvette vide dessus. Ce qu'on lit ensuite est la masse du liquide seul, sans le verre."},
  {kind:"num",fig:{tubes:[{v:62,label:"V₁ : avant"},{v:76,label:"V₂ : avec le solide",solide:true}]},q:"On plonge un solide dans l'éprouvette. <em>Quel est son volume, en cm³ ?</em>",ans:14,unit:"cm³",rep:"V = 14 cm³",
   w:"Le solide chasse l'eau : le niveau monte d'exactement son volume. V = 76 − 62 = <em>14 mL</em>, et 1 mL = 1 cm³, donc 14 cm³."},
  {kind:"num",fig:{tubes:[{v:62,label:"V₁ : avant"},{v:76,label:"V₂ : avec le solide",solide:true}]},q:"Ce même solide a une masse de 37,8 g, et il occupe 14 cm³. <em>Calcule sa masse volumique, en g/cm³.</em>",ans:2.7,unit:"g/cm³",rep:"ρ = 2,7 g/cm³",
   w:"ρ = m ÷ V = 37,8 ÷ 14 = <em>2,7 g/cm³</em> : c'est de l'aluminium. Peser, mesurer, diviser : trois gestes et la matière est identifiée."},
  {kind:"qcm",fig:{tubes:[{v:62,label:"V₁ : avant"},{v:76,label:"V₂ : avec le solide",solide:true}]},q:"Pourquoi le solide doit-il être entièrement sous l'eau ?",ch:["Sinon il ne chasse pas tout son volume","Sinon il devient plus léger","Sinon l'eau s'évapore"],good:0,rep:"Sinon il ne chasse pas tout son volume.",
   w:"Le niveau ne monte que du volume réellement immergé. Un solide qui dépasse fausse la mesure : on le maintient sous l'eau, par exemple avec une aiguille."},
  {kind:"num",fig:null,q:"Un pavé de fer mesure 2 cm sur 3 cm sur 5 cm. <em>Quel est son volume, en cm³ ?</em>",ans:30,unit:"cm³",rep:"V = 30 cm³",
   w:"Pour un solide bien régulier, pas besoin d'eau : V = 2 × 3 × 5 = <em>30 cm³</em>. Ce pavé pèse 237 g, donc ρ = 237 ÷ 30 = 7,9 g/cm³, du fer."},
  {kind:"num",fig:{tubes:[{v:100,label:"100 mL pesés : 80 g"}]},q:"Dans une éprouvette tarée, 100 mL de liquide pèsent 80 g. <em>Calcule sa masse volumique, en g/cm³.</em>",ans:0.8,unit:"g/cm³",rep:"ρ = 0,8 g/cm³",
   w:"ρ = 80 ÷ 100 = <em>0,8 g/cm³</em>. C'est plus léger que l'eau : ce liquide flotterait dessus. À 0,8, c'est de l'éthanol."}
];

const UNITES=[
  {kind:"qcm",q:"1 mL, c'est aussi…",ch:["1 cm³","1 dm³","10 cm³"],good:0,rep:"1 mL = 1 cm³.",
   w:"Le millilitre et le centimètre cube sont deux noms du même volume. C'est ce qui permet de passer d'une éprouvette (en mL) à un calcul en cm³ sans rien convertir."},
  {kind:"qcm",q:"1 L, c'est aussi…",ch:["1 dm³, soit 1000 cm³","1 m³","100 cm³"],good:0,rep:"1 L = 1 dm³ = 1000 cm³.",

/* ============ gamification ============ */
const SHEET_URL="https://script.google.com/macros/s/AKfycbwB53nfh6Xk_z1Gn4ck_WL8aX0gPxDzQ2MpxWVnpsdunmWR_IKj-tHPHOEVkP614jQJ/exec";
function appareil(){
  const ua=navigator.userAgent, n=navigator, e=screen;
  const tactile=(n.maxTouchPoints||0)>0, cote=Math.max(e.width,e.height);
  const os=/iPhone|iPod/.test(ua)?"iOS":/iPad/.test(ua)?"iPadOS":/Android/.test(ua)?"Android":/Windows/.test(ua)?"Windows":/Mac OS X/.test(ua)?(tactile?"iPadOS":"macOS"):/Linux/.test(ua)?"Linux":"autre";
  let nom="autre";
  for(const [cle,val] of [["Edg","Edge"],["OPR","Opera"],["CriOS","Chrome"],["FxiOS","Firefox"],["Firefox","Firefox"],["Chrome","Chrome"],["Version","Safari"]]){
    const m=ua.match(new RegExp(cle+"\\/(\\d+)")); if(m){nom=val+" "+m[1];break;}
  }
  const type=!tactile?"ordinateur":(os==="iPadOS"||(os==="Android"&&!/Mobile/.test(ua))||cote>=1000)?"tablette":"mobile";
  return {appareil:type,os,navigateur:nom,ecran:e.width+"x"+e.height,fenetre:innerWidth+"x"+innerHeight,dpr:devicePixelRatio||1,tactile,langue:n.language||"",ua};
}
function logResult(game,score,good,total,secs){
  try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(Object.assign({page:"masse-volumique",game,score,good,total,secs},appareil()))});}catch(e){}
}
const CHEERS=[["🎉","Bravo !"],["⚗️","Belle expérience !"],["🧪","Excellent !"],["🏆","Champion !"],["🚀","Trop fort !"],["🌡️","Cent degrés de talent !"],["✨","Génial !"],["💧","Limpide !"]];
const OOPS=[["😅","Oups, presque !"],["🙈","Pas cette fois !"],["🤔","Hmm, regarde le schéma..."],["🐢","On y va doucement !"],["🧐","Presque ! Lis la correction."]];
function confetti(host){
  const cols=["#e63946","#f4a261","#2a9d8f","#457b9d","#ffd166","#9b5de5","#06d6a0"];
  for(let i=0;i<22;i++){
    const p=document.createElement("i");p.className="confetti";
    const ang=Math.random()*Math.PI*2, d=60+Math.random()*90;
    p.style.setProperty("--dx",Math.cos(ang)*d+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*d-40)+"px");
    p.style.background=rnd(cols);
    p.style.animationDelay=(Math.random()*.15)+"s";
    host.appendChild(p);
  }
}
function bilanHTML(st,titreOk){
  const good=st.list.length-st.errs.length;
  return `<div class="bilan">
    <h2>${good===st.list.length?"🏆 Sans faute, incroyable !":good>=st.list.length*.8?"🌟 Bravo, belle manche !":good>=st.list.length/2?"👍 Pas mal du tout !":"💪 Continue, tu progresses !"}</h2>
    <p class="bigscore">${st.score}</p>
    <p class="meta">${good} bonnes réponses sur ${st.list.length}, en ${chrono(st.secs)}.</p>
    ${st.errs.length?`<p class="section-title">À revoir</p><ul class="errlist">${st.errs.map(e=>`
      <li><span class="rep">${e.rep}</span> ${e.w}</li>`).join("")}</ul>`
    :`<p class="section-title">Sans faute</p><p style="margin-top:8px">${titreOk}</p>`}
    <div class="row-end"><button class="btn ghost again">Nouvelle manche</button></div>
  </div>`;
}

/* ============ moteur de manche ============ */
function creeManche(o){
  const st={list:[],i:0,score:0,errs:[],t0:0,streak:0,secs:0};
  const hote=$(o.panel);
  function verdict(ok){
    const v=hote.querySelector(".react");
    const [emo,msg]=ok?rnd(CHEERS):rnd(OOPS);
    st.streak=ok?st.streak+1:0;
    v.className="react "+(ok?"yes":"no");
    v.innerHTML=`<span class="emo" role="img" aria-label="${ok?"Bonne réponse":"Mauvaise réponse"}">${emo}</span><span class="msg">${msg}</span>`+
      (st.streak>=3?`<span class="streak">🔥 ${st.streak} d'affilée !</span>`:"");
    if(ok)confetti(v);
  }
  function intro(){
    hote.innerHTML=`<div class="intro"><h2>${o.titre}</h2><p>${o.texte}</p><button class="btn">Commencer la manche</button></div>`;
    hote.querySelector(".btn").onclick=lance;
  }
  function lance(){st.list=shuffle(o.donnees);st.i=0;st.score=0;st.errs=[];st.streak=0;st.t0=Date.now();etape();}
  function etape(){
    if(st.i>=st.list.length)return fin();
    const q=o.prep(st.list[st.i]);
    hote.innerHTML=`
      <div class="status"><span>Question <b>${st.i+1}</b>/${st.list.length}</span><span class="grow"></span><span>Points <b class="pts">${st.score}</b></span></div>
      <div class="carte">
        <div class="react"></div>
        <p class="annot">${q.annot}</p>
        ${q.fig?`<div class="fig">${q.fig}</div>`:""}
        <p class="hyp">${q.hyp}</p>
        <p class="why"></p>
      </div>
      ${q.kind==="num"
        ?`<div class="answer"><input inputmode="decimal" autocomplete="off" placeholder="Ta réponse"><span class="unit">${q.unit}</span><button class="btn ok">Valider</button></div>`
        :`<div class="choices-eq${q.ch.length>4?" deux":""}">${q.ch.map((c,k)=>`<button class="choice" data-k="${k}">${c}</button>`).join("")}</div>`}
      <div class="row-end"><button class="btn hidden suiv">Suivante</button></div>`;
    function revele(ok,saisie){
      verdict(ok);
      hote.querySelector(".carte").classList.add("revealed");
      hote.querySelector(".annot").textContent=q.rep;
      hote.querySelector(".why").innerHTML=(ok?"":`<em>Non${saisie?", tu as répondu "+saisie:""}. </em>`)+q.w;
      hote.querySelector(".pts").textContent=st.score;
      if(q.figApres)hote.querySelector(".fig").innerHTML=q.figApres;
      const n=hote.querySelector(".suiv");n.classList.remove("hidden");
      n.textContent=st.i===st.list.length-1?"Voir le bilan":"Suivante";
      n.onclick=()=>{st.i++;etape();};
      n.focus({preventScroll:true});
    }
    if(q.kind==="num"){
      const input=hote.querySelector(".answer input");input.focus({preventScroll:true});
      function valider(){
        const v=parseFloat(input.value.replace(",",".").trim());
        if(!isFinite(v)){input.value="";input.placeholder="Écris un nombre";return;}
        const ok=Math.abs(v-q.ans)<=0.011;
        if(ok)st.score+=10;else st.errs.push({rep:q.rep,w:q.w});
        input.disabled=true;hote.querySelector(".answer .btn").disabled=true;
        revele(ok,esc(input.value));
      }
      hote.querySelector(".answer .btn").onclick=valider;
      input.addEventListener("keydown",e=>{if(e.key==="Enter")valider();});
    }else{
      hote.querySelectorAll(".choice").forEach(b=>{
        b.onclick=()=>{
          const ok=+b.dataset.k===q.good;
          if(ok)st.score+=10;else st.errs.push({rep:q.rep,w:q.w});
          hote.querySelectorAll(".choice").forEach(x=>{
            x.disabled=true;
            if(+x.dataset.k===q.good)x.classList.add("good");
            else if(x===b)x.classList.add("bad");
            else x.classList.add("dim");
          });
          revele(ok,"");
        };
      });
    }
  }
  function fin(){
    st.secs=Math.round((Date.now()-st.t0)/1000);
    logResult(o.game,st.score,st.list.length-st.errs.length,st.list.length,st.secs);
    hote.innerHTML=bilanHTML(st,o.bravo);
    hote.querySelector(".again").onclick=lance;
  }
  return {intro};
}
