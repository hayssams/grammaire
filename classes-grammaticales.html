<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les classes grammaticales, en contexte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F1;
  --paper-2:#FCFCFA;
  --rule:#BFD3E4;
  --rule-soft:#DDE7F0;
  --marge:#DE5B4A;
  --ink:#16233B;
  --ink-soft:#5E6E85;
  --nom:#1D4E89;
  --verbe:#BE2F28;
  --adjectif:#1B6F55;
  --determinant:#B8651A;
  --pronom:#654AA3;
  --adverbe:#0E6F80;
  --preposition:#836517;
  --conjonction:#9C3670;
  --interjection:#C07E00;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  padding:0 0 40px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- en-tete ---------- */
header{padding:26px 0 14px}
.topbar{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.topbar .eyebrow{margin:0}
.home{
  font-family:var(--sans);font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;padding:6px 12px;background:var(--paper,transparent);
  transition:background .2s,transform .2s
}
.home:hover{background:var(--rule-soft);transform:translateY(-1px)}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;margin:0 0 6px
}
h1{
  font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;
  margin:0 0 4px;letter-spacing:-.01em
}
h1 em{font-style:italic;color:var(--nom)}
.sub{margin:0;color:var(--ink-soft);font-size:14px}

/* ---------- onglets ---------- */
nav{display:flex;gap:6px;margin:18px 0 0;align-items:flex-end}
.tab{
  flex:1;border:1px solid var(--rule);border-bottom:none;
  background:#EDEFE9;color:var(--ink-soft);
  font-family:var(--sans);font-size:12.5px;font-weight:700;
  padding:11px 3px 10px;border-radius:9px 9px 0 0;cursor:pointer;
  letter-spacing:.01em;transition:background .15s,color .15s,transform .15s
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper-2);color:var(--ink);transform:translateY(1px);box-shadow:0 -2px 0 var(--nom) inset}

/* ---------- feuille ---------- */
.sheet{
  position:relative;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:0 0 10px 10px;
  padding:22px 16px 20px 30px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px);
  background-position:0 8px;
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:20px;width:1px;background:var(--marge);opacity:.5
}
.panel{display:none}
.panel.on{display:block}

/* ---------- barre d'etat ---------- */
.status{
  display:flex;align-items:center;gap:12px;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:14px
}
.status .grow{flex:1}
.status b{color:var(--ink);font-size:14px;letter-spacing:0}

/* ---------- phrase ---------- */
.phrase{
  font-family:var(--serif);font-size:26px;line-height:1.45;margin:0 0 6px;letter-spacing:.005em
}
.target{
  color:var(--ink);white-space:nowrap;
  text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;
  text-decoration-color:var(--ink);
  transition:color .3s ease,text-decoration-color .3s ease
}
.revealed .target{color:var(--hl,var(--ink));text-decoration-color:var(--hl,var(--ink));text-decoration-thickness:3px}
.annot{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);transition:color .3s ease;
  margin:0 0 4px
}
.revealed .annot{color:var(--hl,var(--ink-soft))}
.react{text-align:center;min-height:78px;margin:0 0 8px;position:relative}
.react .emo{display:inline-block;font-size:48px;line-height:52px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.react .msg{display:block;font-family:var(--sans);font-weight:800;font-size:16px;line-height:22px;letter-spacing:.02em;animation:pop .45s .1s both cubic-bezier(.2,1.6,.4,1)}
.react.yes .msg{color:var(--nom)}
.react.no .msg{color:var(--marge)}
.react.no .emo{animation:shake .5s ease}
.react .streak{display:block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px;animation:pop .4s .25s both}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px) rotate(-8deg)}40%,80%{transform:translateX(8px) rotate(8deg)}}
.confetti{position:absolute;left:50%;top:26px;width:9px;height:9px;border-radius:2px;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.why{
  font-size:14px;color:var(--ink-soft);margin:8px 0 0;min-height:42px;
  opacity:0;transition:opacity .3s .3s
}
.revealed .why{opacity:1}
.why em{font-style:normal;color:var(--ink);font-weight:700}

/* ---------- choix ---------- */
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:7px;margin:18px 0 0}
.choice{
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);
  font-family:var(--sans);font-size:13px;font-weight:700;
  padding:11px 4px;border-radius:7px;cursor:pointer;
  transition:background .12s,border-color .12s,color .12s,opacity .2s
}
.choice:hover:not(:disabled){border-color:var(--ink);background:#F1F3EE}
.choice:disabled{cursor:default}
.choice.dim{opacity:.32}
.choice.good{background:var(--c);border-color:var(--c);color:#fff;opacity:1}
.choice.bad{background:transparent;border-color:var(--marge);color:var(--marge);opacity:1;text-decoration:line-through}

/* ---------- boutons ---------- */
.btn{
  display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);
  font-family:var(--sans);font-size:15px;font-weight:700;padding:12px 22px;border-radius:8px;cursor:pointer;
  transition:opacity .15s
}
.btn:hover{opacity:.86}
.btn.ghost{background:transparent;color:var(--ink)}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;min-height:46px;align-items:center}
.hidden{display:none !important}

/* ---------- accueil de manche ---------- */
.intro{padding:6px 0 4px}
.intro h2{font-family:var(--serif);font-weight:400;font-size:27px;margin:0 0 8px;line-height:1.15}
.intro p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;max-width:44ch}

/* ---------- bilan ---------- */
.bilan h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 2px}
.bigscore{font-family:var(--serif);font-size:56px;line-height:1;margin:10px 0 2px}
.bilan .meta{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
.errlist{border-top:1px solid var(--rule-soft);margin:14px 0 0;padding:0;list-style:none}
.errlist li{border-bottom:1px solid var(--rule-soft);padding:11px 0}
.errlist .ph{font-family:var(--serif);font-size:18px;line-height:1.35}
.errlist .tags{font-size:12px;font-weight:700;letter-spacing:.04em;margin-top:3px}
.errlist .tags .ko{color:var(--marge);text-decoration:line-through;margin-right:8px}
.errlist .tags .ok{color:var(--c)}
.section-title{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  margin:22px 0 0
}

/* ---------- cameleons ---------- */
.word-card{
  border:1px solid var(--rule);border-radius:9px;background:#F1F4F8;
  padding:12px 14px;margin:0 0 18px;display:flex;align-items:baseline;gap:10px
}
.word-card .lbl{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.word-card .w{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1}
.duo{margin:0;padding:0;list-style:none}
.duo li{padding:14px 0;border-top:1px solid var(--rule-soft)}
.duo .ph{font-family:var(--serif);font-size:21px;line-height:1.4}
.duo .cls{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--c);margin-top:4px}
.verdict{font-family:var(--serif);font-size:23px;line-height:1.3;margin:16px 0 0}

/* ---------- memo ---------- */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:6px}
.card{
  position:relative;aspect-ratio:3/4;border:0;padding:0;background:transparent;cursor:pointer;
  perspective:700px;font-family:var(--sans)
}
.card .inner{
  position:absolute;inset:0;transition:transform .42s cubic-bezier(.4,0,.2,1);
  transform-style:preserve-3d
}
.card.up .inner,.card.done .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:8px;display:flex;align-items:center;justify-content:center;
  padding:7px;text-align:center;border:1px solid var(--rule)
}
.face.back{
  background:#EAF0F6;
  background-image:repeating-linear-gradient(to bottom,transparent 0 9px,var(--rule-soft) 9px 10px),
                   repeating-linear-gradient(to right,transparent 0 9px,var(--rule-soft) 9px 10px)
}
.face.front{transform:rotateY(180deg);background:var(--paper-2);flex-direction:column;gap:3px}
.face.front .ph{font-family:var(--serif);font-size:15px;line-height:1.25}
.face.front .ph .hl{color:var(--c);border-bottom:2px solid var(--c)}
.face.front .cls{
  font-size:12px;font-weight:700;letter-spacing:.05em;color:#fff;
  background:var(--c);border-radius:5px;padding:5px 7px;line-height:1.15
}
.card.done .face{border-color:var(--c);opacity:.55}
.card.done{cursor:default}

/* ---------- cartes ---------- */
.boxes{display:flex;gap:5px;margin-bottom:16px}
.box{flex:1;border:1px solid var(--rule);border-radius:7px;padding:6px 3px;text-align:center;background:#F1F3EE;transition:border-color .2s,background .2s}
.box.hot{border-color:var(--ink);background:var(--paper-2)}
.box .n{font-family:var(--serif);font-size:21px;line-height:1.05}
.box .l{font-size:9px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-soft)}
.flash{perspective:1100px;margin-bottom:14px}
.flash-inner{position:relative;min-height:250px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1)}
.flash.turned .flash-inner{transform:rotateY(180deg)}
.flash-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--rule);border-radius:11px;background:var(--paper-2);
  padding:20px 18px;display:flex;flex-direction:column;justify-content:center;overflow:auto
}
.flash-face.verso{transform:rotateY(180deg);border-color:var(--c);border-width:2px}
.flash .phrase{font-size:24px;margin:0}
.flash .rep{font-family:var(--serif);font-size:34px;line-height:1.1;color:var(--c);margin:0 0 10px}
.flash .rep-why{font-size:15px;color:var(--ink-soft);margin:0}
.flash .rep-ph{font-family:var(--serif);font-size:17px;color:var(--ink);margin:12px 0 0;padding-top:10px;border-top:1px solid var(--rule-soft)}
.consigne{font-size:13px;color:var(--ink-soft);text-align:center;margin:0 0 14px}
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.judge .btn{width:100%;text-align:center}
.judge .no{background:transparent;color:var(--marge);border-color:var(--marge)}

@media (max-width:360px){
  .phrase{font-size:23px}
  .face.front .ph{font-size:13px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--nom);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar"><a class="home" href="index.html">🏠 Accueil</a><p class="eyebrow">Français, 3<sup>e</sup></p></div>
    <h1>La classe d'un mot se lit <em>dans la phrase</em></h1>
    <p class="sub">Quatre entraînements. Le même mot ne garde pas toujours la même classe.</p>
    <nav role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-panel="quiz">En contexte</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="cam">Caméléons</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="memo">Mémo</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="cartes">Cartes</button>
    </nav>
  </header>

  <div class="sheet">
    <section class="panel on" id="quiz"></section>
    <section class="panel" id="cam"></section>
    <section class="panel" id="memo"></section>
    <section class="panel" id="cartes"></section>
  </div>
</div>

<script>
/* ============ donnees ============ */
const CLASSES = {
  nom:{label:"Nom", v:"--nom"},
  verbe:{label:"Verbe", v:"--verbe"},
  adjectif:{label:"Adjectif", v:"--adjectif"},
  determinant:{label:"Déterminant", v:"--determinant"},
  pronom:{label:"Pronom", v:"--pronom"},
  adverbe:{label:"Adverbe", v:"--adverbe"},
  preposition:{label:"Préposition", v:"--preposition"},
  conjonction:{label:"Conjonction", v:"--conjonction"},
  interjection:{label:"Interjection", v:"--interjection"}
};
const ORDER = ["nom","verbe","adjectif","determinant","pronom","adverbe","preposition","conjonction","interjection"];
const col = id => `var(${CLASSES[id].v})`;

const QUIZ = [
  {s:"Le [[silence]] de la salle m'impressionnait.", c:"nom", w:"Précédé d'un déterminant, il désigne une réalité abstraite."},
  {s:"[[Marseille]] est un port méditerranéen.", c:"nom", w:"Nom propre : majuscule, pas de déterminant."},
  {s:"Son [[courage]] a surpris tout le monde.", c:"nom", w:"Un nom peut désigner une qualité, pas seulement un objet."},
  {s:"Le [[rire]] des enfants traversait la cour.", c:"nom", w:"Ici il ne se conjugue pas : c'est le nom, pas le verbe rire."},
  {s:"Nous avons visité le [[musée]] hier.", c:"nom", w:"Noyau du groupe nominal complément."},
  {s:"Elle a rangé son [[cartable]] sous la table.", c:"nom", w:"Il varie en nombre : un cartable, des cartables."},
  {s:"Les élèves [[bavardent]] pendant le cours.", c:"verbe", w:"Il se conjugue et s'accorde avec le sujet les élèves."},
  {s:"Il [[faudrait]] partir avant la nuit.", c:"verbe", w:"Verbe impersonnel au conditionnel."},
  {s:"Nous [[avons]] terminé l'exercice.", c:"verbe", w:"Auxiliaire : c'est toujours un verbe."},
  {s:"Elle [[semble]] fatiguée.", c:"verbe", w:"Verbe d'état, il introduit l'attribut fatiguée."},
  {s:"[[Ferme]] la porte, s'il te plaît.", c:"verbe", w:"Impératif présent. Attention, ferme peut aussi être un nom ou un adjectif."},
  {s:"Ce que tu [[dis]] est faux.", c:"verbe", w:"Conjugué à la 2e personne, dans la subordonnée."},
  {s:"Une réponse [[maladroite]] a suffi.", c:"adjectif", w:"Il s'accorde avec le nom réponse, qu'il qualifie."},
  {s:"Il portait un manteau [[noir]].", c:"adjectif", w:"Épithète, placé après le nom."},
  {s:"Cette histoire est [[incroyable]].", c:"adjectif", w:"Attribut du sujet, relié par le verbe être."},
  {s:"Elle semblait [[heureuse]] de nous voir.", c:"adjectif", w:"Attribut du sujet après un verbe d'état. La fonction change, la classe reste."},
  {s:"Un [[long]] silence suivit.", c:"adjectif", w:"Épithète antéposée : il se met au féminin, longue."},
  {s:"Les [[vieux]] murs s'effritaient.", c:"adjectif", w:"Il qualifie murs et s'accorde avec lui."},
  {s:"[[Mon]] frère arrive demain.", c:"determinant", w:"Déterminant possessif : il précède le nom et l'accompagne."},
  {s:"Prends [[trois]] feuilles.", c:"determinant", w:"Déterminant numéral, il indique la quantité."},
  {s:"[[Quelle]] heure est-il ?", c:"determinant", w:"Déterminant interrogatif, accolé au nom heure."},
  {s:"[[Aucun]] élève n'a répondu.", c:"determinant", w:"Déterminant indéfini. Seul, aucun serait un pronom."},
  {s:"Je voudrais [[du]] pain.", c:"determinant", w:"Déterminant partitif, pour une quantité indéterminée."},
  {s:"[[Ces]] arbres ont plus de cent ans.", c:"determinant", w:"Déterminant démonstratif."},
  {s:"Je [[le]] connais depuis l'école.", c:"pronom", w:"Il remplace un nom et se place devant le verbe. Devant un nom, ce serait un déterminant."},
  {s:"[[Personne]] n'a compris la consigne.", c:"pronom", w:"Pronom indéfini sujet. Avec un déterminant, une personne serait un nom."},
  {s:"Le livre [[que]] j'ai lu était court.", c:"pronom", w:"Pronom relatif : il reprend le livre et introduit la relative."},
  {s:"[[Qui]] a éteint la lumière ?", c:"pronom", w:"Pronom interrogatif, sujet de la question."},
  {s:"[[Celui]] de gauche me plaît.", c:"pronom", w:"Pronom démonstratif, il remplace un nom déjà connu."},
  {s:"Elle s'est blessée en [[se]] levant.", c:"pronom", w:"Pronom personnel réfléchi."},
  {s:"Il court [[vite]].", c:"adverbe", w:"Invariable, il modifie le verbe court."},
  {s:"Elle a [[très]] bien répondu.", c:"adverbe", w:"Un adverbe peut modifier un autre adverbe."},
  {s:"[[Hier]], nous avons visité le port.", c:"adverbe", w:"Adverbe de temps, invariable."},
  {s:"Je ne viendrai [[pas]].", c:"adverbe", w:"Adverbe de négation, avec ne."},
  {s:"Le film est [[trop]] long.", c:"adverbe", w:"Il modifie l'adjectif long."},
  {s:"Ils marchaient [[lentement]] vers la sortie.", c:"adverbe", w:"Formé sur l'adjectif lente, terminaison -ment."},
  {s:"Le chat dort [[sous]] la table.", c:"preposition", w:"Elle introduit le groupe nominal la table."},
  {s:"Il est parti [[sans]] prévenir.", c:"preposition", w:"Une préposition peut introduire un infinitif."},
  {s:"Une tasse [[de]] thé.", c:"preposition", w:"Elle relie deux noms, sans rien introduire d'autre."},
  {s:"Nous partons [[pour]] Lyon.", c:"preposition", w:"Invariable, elle introduit un complément."},
  {s:"Elle travaille [[avec]] méthode.", c:"preposition", w:"Elle introduit le groupe nominal méthode."},
  {s:"Il pleut, [[donc]] nous restons.", c:"conjonction", w:"Conjonction de coordination : mais, ou, et, donc, or, ni, car."},
  {s:"Je pense [[que]] tu as raison.", c:"conjonction", w:"Conjonction de subordination : elle ne remplace aucun nom, contrairement au pronom relatif."},
  {s:"Reste ici [[et]] attends-moi.", c:"conjonction", w:"Elle coordonne deux propositions."},
  {s:"[[Comme]] il pleuvait, nous sommes rentrés.", c:"conjonction", w:"Conjonction de subordination, elle exprime la cause."},
  {s:"Nous partirons [[quand]] tu seras prêt.", c:"conjonction", w:"Elle introduit une subordonnée de temps."},
  {s:"[[Chut]] ! Le film commence.", c:"interjection", w:"Mot isolé qui exprime une réaction, suivi d'un point d'exclamation."},
  {s:"[[Aïe]] ! Je me suis pincé le doigt.", c:"interjection", w:"Elle exprime une sensation, hors de la construction de la phrase."},
  {s:"[[Bravo]] ! Tu as réussi.", c:"interjection", w:"Elle exprime un sentiment et ne joue aucun rôle grammatical."},
  {s:"[[Hélas]], il était trop tard.", c:"interjection", w:"Elle exprime le regret, elle se retire sans casser la phrase."}
];

const CAM = [
  {w:"le", a:{s:"Je [[le]] vois arriver.", c:"pronom"}, b:{s:"[[Le]] train part à huit heures.", c:"determinant"},
   t:"Devant un verbe, le remplace un nom : pronom. Devant un nom, il l'accompagne : déterminant."},
  {w:"que", a:{s:"Le film [[que]] j'ai vu était long.", c:"pronom"}, b:{s:"Je crois [[que]] tu exagères.", c:"conjonction"},
   t:"Si que reprend un nom placé avant, c'est un pronom relatif. Sinon il ne fait qu'introduire : conjonction."},
  {w:"ferme", a:{s:"[[Ferme]] la fenêtre.", c:"verbe"}, b:{s:"Ils ont acheté une [[ferme]].", c:"nom"},
   t:"Test simple : si on peut le conjuguer, c'est un verbe. S'il suit un déterminant, c'est un nom."},
  {w:"bien", a:{s:"Il travaille [[bien]].", c:"adverbe"}, b:{s:"Il a hérité d'un [[bien]] précieux.", c:"nom"},
   t:"Un adverbe modifie le verbe. Précédé de un et qualifié par un adjectif, c'est un nom."},
  {w:"rire", a:{s:"Son [[rire]] résonnait dans la cour.", c:"nom"}, b:{s:"Tu vas [[rire]] en lisant ça.", c:"verbe"},
   t:"Après un déterminant, l'infinitif devient un nom."},
  {w:"son", a:{s:"[[Son]] frère est absent.", c:"determinant"}, b:{s:"Un [[son]] aigu m'a réveillée.", c:"nom"},
   t:"Deux mots identiques, deux histoires différentes. Regarde ce qui est devant."},

/* ============ outils ============ */
const $ = (sel,root=document)=>root.querySelector(sel);
const shuffle = a => {const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const pick = (a,n) => shuffle(a).slice(0,n);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function phraseHTML(s,cls){
  return esc(s).replace(/\[\[(.+?)\]\]/,(m,w)=>`<span class="target">${w}</span>`);
}
function plainWord(s){const m=s.match(/\[\[(.+?)\]\]/);return m?m[1]:"";}
function chrono(sec){return sec<60?sec+" s":Math.floor(sec/60)+" min "+String(sec%60).padStart(2,"0");}

document.querySelectorAll(".tab").forEach(t=>{

function choicesHTML(){
  return `<div class="choices">${ORDER.map(id=>
    `<button class="choice" data-c="${id}" style="--c:${col(id)}">${CLASSES[id].label}</button>`).join("")}</div>`;
}
function markChoices(root,correct,chosen){
  root.querySelectorAll(".choice").forEach(b=>{
    b.disabled=true;
    if(b.dataset.c===correct)b.classList.add("good");
    else if(b.dataset.c===chosen)b.classList.add("bad");

}

const Q = {list:[],i:0,score:0,errs:[],t0:0,streak:0};
const CHEERS=[["🎉","Bravo !"],["⭐","Super !"],["🚀","Excellent !"],["🏆","Champion !"],["🦄","Magnifique !"],["🔥","Trop fort !"],["🌟","Génial !"],["🐱","Miaou, bien joué !"]];
const OOPS=[["😅","Oups, presque !"],["🙈","Pas cette fois !"],["🤔","Hmm, regarde bien..."],["🐢","On y va doucement !"],["🧐","Presque ! Lis l'explication."]];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function confetti(host){
  const cols=["#e63946","#f4a261","#2a9d8f","#457b9d","#ffd166","#9b5de5","#06d6a0"];
  for(let i=0;i<22;i++){
    const p=document.createElement("i");p.className="confetti";
    const ang=Math.random()*Math.PI*2, d=60+Math.random()*90;
    p.style.setProperty("--dx",Math.cos(ang)*d+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*d-40)+"px");
    p.style.background=rnd(cols);
    p.style.animationDelay=(Math.random()*.15)+"s";
    host.appendChild(p);
  }
}
function showVerdict(ok,sel="#qv",st=Q,cheers=CHEERS,oops=OOPS){
  const v=$(sel);
  const [emo,msg]=ok?rnd(cheers):rnd(oops);
  st.streak=ok?st.streak+1:0;
  v.className="react "+(ok?"yes":"no");
  v.innerHTML=`<span class="emo" role="img" aria-label="${ok?"Bonne réponse":"Mauvaise réponse"}">${emo}</span><span class="msg">${msg}</span>`+
    (st.streak>=3?`<span class="streak">🔥 ${st.streak} d'affilée !</span>`:"");
  if(ok)confetti(v);
}

function quizStep(){
  if(Q.i>=Q.list.length)return quizEnd();
  const q=Q.list[Q.i];
  qp.innerHTML=`
    <div class="status"><span>Phrase <b>${Q.i+1}</b>/${Q.list.length}</span><span class="grow"></span><span>Points <b id="qsc">${Q.score}</b></span></div>

    b.onclick=()=>reveal(b.dataset.c);

  function reveal(chosen){
    const ok=chosen===q.c;

  $("#qagain").onclick=()=>{Q.list=pick(QUIZ,10);Q.i=0;Q.score=0;Q.errs=[];Q.streak=0;Q.t0=Date.now();quizStep();};

const C = {list:[],i:0,step:0,good:0,total:0,streak:0};
const C_CHEERS=[["🦎","Le caméléon n'a pas réussi à te tromper !"],["🕵️","Démasqué !"],["🎯","Dans le mille !"],["🦎","Pas de camouflage qui tienne !"],["⭐","Super !"],["🎉","Bravo !"]];
const C_OOPS=[["🦎","Le caméléon t'a eu !"],["🙈","Il a changé de couleur, regarde autour."],["🤔","Hmm, ce mot cache bien son jeu..."],["😅","Oups, presque !"]];
const C_OKWHY=["Exact, il a beau changer de couleur, tu l'as reconnu.","Bien vu, le déguisement n'a pas marché.","Exact ! Rien ne t'échappe."];

function camIntro(){

/* ============ 3. memo ============ */
const M = {cards:[],open:[],found:0,tries:0,t0:0,lock:false};
const mp = $("#memo");

function memoIntro(){
  mp.innerHTML=`<div class="intro">
    <h2>Six phrases, six classes.</h2>
    <p>Chaque carte-phrase a un mot souligné. Retrouve la carte-classe qui lui correspond. Ce n'est pas le mot qu'on retient, c'est son emploi.</p>
    <button class="btn" id="mgo">Distribuer</button>
  </div>`;
  $("#mgo").onclick=memoStart;
}
function memoStart(){
  const pairs=pick(MEMO,6);
  M.cards=shuffle(pairs.flatMap((p,k)=>[{k,type:"ph",p},{k,type:"cl",p}]));
  M.open=[];M.found=0;M.tries=0;M.lock=false;M.t0=Date.now();
  memoRender();
}
function memoRender(){
  mp.innerHTML=`
    <div class="status"><span>Paires <b id="mfd">${M.found}</b>/6</span><span class="grow"></span><span>Essais <b id="mtr">${M.tries}</b></span></div>
    <div class="board" id="mboard">${M.cards.map((c,i)=>`
      <button class="card" data-i="${i}" style="--c:${col(c.p.c)}" aria-label="Carte ${i+1}">
        <span class="inner">
          <span class="face back"></span>
          <span class="face front">${c.type==="ph"
            ? `<span class="ph">${esc(c.p.s).replace(/\[\[(.+?)\]\]/,'<span class="hl">$1</span>')}</span>`
            : `<span class="cls">${CLASSES[c.p.c].label}</span>`}</span>
        </span>
      </button>`).join("")}</div>
    <div class="row-end"><button class="btn ghost" id="mreset">Redistribuer</button></div>`;
  $("#mreset").onclick=memoStart;
  mp.querySelectorAll(".card").forEach(btn=>btn.onclick=()=>memoFlip(btn));
}
function memoFlip(btn){
  const i=+btn.dataset.i;
  if(M.lock||btn.classList.contains("up")||btn.classList.contains("done"))return;
  btn.classList.add("up");M.open.push(i);
  if(M.open.length<2)return;
  M.lock=true;M.tries++;$("#mtr").textContent=M.tries;
  const [a,b]=M.open, ca=M.cards[a], cb=M.cards[b];
  const same = ca.k===cb.k && ca.type!==cb.type;
  setTimeout(()=>{
    const ea=mp.querySelector(`[data-i="${a}"]`), eb=mp.querySelector(`[data-i="${b}"]`);
    if(same){
      ea.classList.add("done");eb.classList.add("done");
      M.found++;$("#mfd").textContent=M.found;
      if(M.found===6)setTimeout(memoEnd,450);
    }else{ea.classList.remove("up");eb.classList.remove("up");}
    M.open=[];M.lock=false;
  }, same?420:900);
}
function memoEnd(){
  const secs=Math.round((Date.now()-M.t0)/1000);
  logResult("memory",M.tries,M.found,6,secs);
  mp.innerHTML=`<div class="bilan">
    <h2>Tableau complet</h2>
    <p class="bigscore">${M.tries}</p>
    <p class="meta">essais, en ${chrono(secs)}. Le minimum possible est de six.</p>
    <div class="row-end"><button class="btn ghost" id="magain">Redistribuer</button></div>
  </div>`;
  $("#magain").onclick=memoStart;
}

/* ============ 4. cartes ============ */
const F = {queue:[],mastered:0,flips:0,ratees:[],t0:0,size:12};
const fp = $("#cartes");

function cardsIntro(){
  fp.innerHTML=`<div class="intro">
    <h2>Répondre sans voir les propositions.</h2>
    <p>Douze cartes. Tu lis la phrase, tu dis la classe à voix haute, <em>puis</em> tu retournes. Une carte sue monte d'une boîte, une carte ratée retombe dans la première. La série s'arrête quand les douze ont atteint la boîte 3.</p>
    <button class="btn" id="fgo">Prendre le paquet</button>
  </div>`;
  $("#fgo").onclick=()=>{
    F.queue=pick(QUIZ,F.size).map(it=>({it,box:1,rate:false}));
    F.mastered=0;F.flips=0;F.ratees=[];F.t0=Date.now();
    cardsStep();
  };
}
function cardsStep(){
  if(!F.queue.length)return cardsEnd();
  const c=F.queue[0], q=c.it, counts=[1,2,3].map(b=>F.queue.filter(x=>x.box===b).length);
  fp.innerHTML=`
    <div class="boxes">
      ${counts.map((n,k)=>`<div class="box${c.box===k+1?" hot":""}"><div class="n">${n}</div><div class="l">Boîte ${k+1}</div></div>`).join("")}
      <div class="box"><div class="n">${F.mastered}</div><div class="l">Sues</div></div>
    </div>
    <div class="flash" id="fcard" style="--c:${col(q.c)}">
      <div class="flash-inner">
        <div class="flash-face recto">
          <p class="annot">Classe de « ${plainWord(q.s)} » ?</p>
          <p class="phrase">${phraseHTML(q.s)}</p>
        </div>
        <div class="flash-face verso">
          <p class="rep">${CLASSES[q.c].label}</p>
          <p class="rep-why">${esc(q.w)}</p>
          <p class="rep-ph">${phraseHTML(q.s)}</p>
        </div>
      </div>
    </div>
    <p class="consigne" id="fhint">Dis la réponse à voix haute avant de retourner.</p>
    <div id="factions"><button class="btn" id="fturn" style="width:100%">Retourner la carte</button></div>`;
  $("#fturn").onclick=()=>{
    F.flips++;
    const card=$("#fcard"), verso=card.querySelector(".verso");
    card.classList.add("turned");
    verso.style.setProperty("--hl",col(q.c));
    verso.classList.add("revealed");
    $("#fhint").textContent="Sois honnête : tu l'avais dit, ou tu l'as reconnu en lisant ?";
    $("#factions").innerHTML=`<div class="judge">
      <button class="btn no" id="fko">Pas su</button>
      <button class="btn" id="fok">Je savais</button></div>`;
    $("#fok").onclick=()=>judge(true);
    $("#fko").onclick=()=>judge(false);
  };
  function judge(ok){
    F.queue.shift();
    if(ok){
      c.box++;
      if(c.box>3){F.mastered++; if(c.rate)F.ratees.push(q);}
      else F.queue.splice(Math.min(c.box===2?3:6,F.queue.length),0,c);
    }else{
      c.box=1;c.rate=true;
      F.queue.splice(Math.min(2,F.queue.length),0,c);
    }
    cardsStep();
  }
}
function cardsEnd(){
  const secs=Math.round((Date.now()-F.t0)/1000);
  logResult("cartes",F.flips,F.size-F.ratees.length,F.size,secs);
  const uniques=[...new Map(F.ratees.map(q=>[q.s,q])).values()];
  fp.innerHTML=`<div class="bilan">
    <h2>Paquet terminé</h2>
    <p class="bigscore">${F.flips}</p>
    <p class="meta">retournements pour ${F.size} cartes, en ${chrono(secs)}. Le minimum est de ${F.size*3}.</p>
    ${uniques.length?`<p class="section-title">Cartes qui ont résisté</p><ul class="errlist">${uniques.map(q=>`
      <li class="revealed" style="--c:${col(q.c)};--hl:${col(q.c)}">
        <div class="ph">${phraseHTML(q.s)}</div>
        <div class="tags"><span class="ok">${CLASSES[q.c].label}</span></div>
        <div class="why" style="opacity:1;min-height:0">${esc(q.w)}</div>
      </li>`).join("")}</ul>`
    :`<p style="margin-top:10px">Aucune carte n'est retombée dans la boîte 1. Reprends un paquet, il sera tiré ailleurs dans la banque.</p>`}
    <div class="row-end"><button class="btn ghost" id="fagain">Nouveau paquet</button></div>
  </div>`;
