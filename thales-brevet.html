<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thalès, niveau brevet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F1;
  --paper-2:#FCFCFA;
  --rule:#BFD3E4;
  --rule-soft:#DDE7F0;
  --marge:#DE5B4A;
  --ink:#16233B;
  --ink-soft:#5E6E85;
  --maths:#1B6F55;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  padding:0 0 40px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- en-tete ---------- */
header{padding:26px 0 14px}
.topbar{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.topbar .eyebrow{margin:0}
.home{
  font-family:var(--sans);font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;padding:6px 12px;background:var(--paper,transparent);
  transition:background .2s,transform .2s
}
.home:hover{background:var(--rule-soft);transform:translateY(-1px)}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;margin:0 0 6px
}
h1{
  font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;
  margin:0 0 4px;letter-spacing:-.01em
}
h1 em{font-style:italic;color:var(--maths)}
.sub{margin:0;color:var(--ink-soft);font-size:14px}

/* ---------- onglets ---------- */
nav{display:flex;gap:6px;margin:18px 0 0;align-items:flex-end}
.tab{
  flex:1;border:1px solid var(--rule);border-bottom:none;
  background:#EDEFE9;color:var(--ink-soft);
  font-family:var(--sans);font-size:12.5px;font-weight:700;
  padding:11px 3px 10px;border-radius:9px 9px 0 0;cursor:pointer;
  letter-spacing:.01em;transition:background .15s,color .15s,transform .15s
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper-2);color:var(--ink);transform:translateY(1px);box-shadow:0 -2px 0 var(--maths) inset}

/* ---------- feuille ---------- */
.sheet{
  position:relative;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:0 0 10px 10px;
  padding:22px 16px 20px 30px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px);
  background-position:0 8px;
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:20px;width:1px;background:var(--marge);opacity:.5
}
.panel{display:none}
.panel.on{display:block}

/* ---------- barre d'etat ---------- */
.status{
  display:flex;align-items:center;gap:12px;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:14px
}
.status .grow{flex:1}
.status b{color:var(--ink);font-size:14px;letter-spacing:0}

/* ---------- figure ---------- */
.fig{margin:0 0 4px}
.fig svg{width:100%;height:auto;display:block}
.fig .tr{stroke:var(--ink);stroke-width:1.6;stroke-linecap:round}
.fig .par{stroke:var(--maths);stroke-width:2.2;stroke-linecap:round}
.fig .par.dash{stroke-dasharray:6 5}
.fig .chev{stroke:var(--maths);stroke-width:1.8;fill:none;stroke-linecap:round}
.fig .pt{fill:var(--ink)}
.fig .ptn{font:italic 15px var(--serif);fill:var(--ink);paint-order:stroke;stroke:var(--paper-2);stroke-width:4}
.fig .len{font:700 12px var(--sans);fill:var(--ink-soft);paint-order:stroke;stroke:var(--paper-2);stroke-width:4}
.fig .len.unknown{fill:var(--marge);font-size:14px}
.fig .arc{fill:none;stroke-width:2}
.fig .ang{font:700 11.5px var(--sans);paint-order:stroke;stroke:var(--paper-2);stroke-width:4}
.echelle{font-size:11px;color:var(--ink-soft);text-align:right;margin:0 0 8px}
.hyp{font-size:14.5px;margin:0 0 6px}
.hyp em{font-style:normal;font-weight:700}
.annot{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);transition:color .3s ease;margin:0 0 4px
}
.revealed .annot{color:var(--maths)}

/* ---------- enonces longs (manche Brevet) ---------- */
.contexte{font-size:14.5px;margin:0 0 8px;color:var(--ink)}
.rappel{
  display:block;font-size:13px;font-weight:700;color:var(--maths);
  border-left:3px solid var(--maths);padding:4px 0 4px 9px;margin:0 0 8px
}

/* ---------- fractions ---------- */
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 3px;font-family:var(--serif);font-style:italic;line-height:1.2}
.frac .fn{border-bottom:1.5px solid currentColor;padding:0 5px}
.frac .fd{padding:0 5px}
.egal{font-family:var(--serif);margin:0 5px}

/* ---------- reactions ---------- */
.react{text-align:center;min-height:78px;margin:0 0 8px;position:relative}
.react .emo{display:inline-block;font-size:48px;line-height:52px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.react .msg{display:block;font-family:var(--sans);font-weight:800;font-size:16px;line-height:22px;letter-spacing:.02em;animation:pop .45s .1s both cubic-bezier(.2,1.6,.4,1)}
.react.yes .msg{color:var(--maths)}
.react.no .msg{color:var(--marge)}
.react.no .emo{animation:shake .5s ease}
.react .streak{display:block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px;animation:pop .4s .25s both}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px) rotate(-8deg)}40%,80%{transform:translateX(8px) rotate(8deg)}}
.confetti{position:absolute;left:50%;top:26px;width:9px;height:9px;border-radius:2px;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.why{font-size:14px;color:var(--ink-soft);margin:8px 0 0;opacity:0;transition:opacity .3s .3s}
.revealed .why{opacity:1}
.why em{font-style:normal;color:var(--ink);font-weight:700}
.why .frac{font-size:15px}
.demo{margin:8px 0 0;padding:0 0 0 20px;font-size:13.5px;color:var(--ink)}
.demo li{margin:0 0 3px}

/* ---------- choix ---------- */
.choices-eq{display:grid;gap:8px;margin-top:16px}
.choice{
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);
  font-family:var(--serif);font-size:18px;
  padding:12px 6px;border-radius:7px;cursor:pointer;text-align:center;
  transition:background .12s,border-color .12s,color .12s,opacity .2s
}
.choice.txt{font-family:var(--sans);font-size:14.5px;text-align:left;padding:11px 12px;line-height:1.35}
.choice:hover:not(:disabled){border-color:var(--ink);background:#F1F3EE}
.choice:disabled{cursor:default}
.choice.dim{opacity:.32}
.choice.good{background:var(--maths);border-color:var(--maths);color:#fff;opacity:1}
.choice.bad{background:transparent;border-color:var(--marge);color:var(--marge);opacity:1;text-decoration:line-through}

/* ---------- remise en ordre ---------- */
.bande{list-style:none;counter-reset:etape;margin:14px 0 0;padding:0;min-height:8px}
.bande li{
  counter-increment:etape;position:relative;
  border:1px solid var(--maths);border-radius:7px;background:#EEF4F0;
  font-size:13.5px;line-height:1.35;padding:9px 10px 9px 34px;margin:0 0 6px;cursor:pointer
}
.bande li::before{
  content:counter(etape);position:absolute;left:10px;top:9px;
  font-weight:700;font-size:12px;color:var(--maths)
}
.bande li.bad{border-color:var(--marge);background:#FBEFED}
.bande li.bad::before{color:var(--marge)}
.bande li.fige{cursor:default}
.vide{font-size:13px;color:var(--ink-soft);margin:12px 0 0;font-style:italic}
.tas{margin:14px 0 0;display:grid;gap:6px}
.etiq{
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);
  font-family:var(--sans);font-size:13.5px;line-height:1.35;text-align:left;
  padding:10px 12px;border-radius:7px;cursor:pointer;
  transition:border-color .12s,opacity .2s
}
.etiq:hover:not(:disabled){border-color:var(--ink)}
.etiq.used{opacity:.28;cursor:default}
.etiq:disabled{cursor:default}

/* ---------- saisie ---------- */
.answer{display:flex;gap:8px;align-items:center;margin-top:16px}
.answer input{
  flex:1;min-width:0;border:1px solid var(--rule);border-radius:8px;padding:12px;
  font-family:var(--sans);font-size:18px;background:var(--paper-2);color:var(--ink)
}
.answer input:disabled{opacity:.6}
.answer .unit{font-weight:700;color:var(--ink-soft)}

/* ---------- boutons ---------- */
.btn{
  display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);
  font-family:var(--sans);font-size:15px;font-weight:700;padding:12px 22px;border-radius:8px;cursor:pointer;
  transition:opacity .15s
}
.btn:hover{opacity:.86}
.btn:disabled{cursor:default;opacity:.45}
.btn.ghost{background:transparent;color:var(--ink)}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;min-height:46px;align-items:center}
.hidden{display:none !important}

/* ---------- accueil de manche ---------- */
.intro{padding:6px 0 4px}
.intro h2{font-family:var(--serif);font-weight:400;font-size:27px;margin:0 0 8px;line-height:1.15}
.intro p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;max-width:44ch}

/* ---------- bilan ---------- */
.bilan h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 2px}
.bigscore{font-family:var(--serif);font-size:56px;line-height:1;margin:10px 0 2px}
.bilan .meta{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
.errlist{border-top:1px solid var(--rule-soft);margin:14px 0 0;padding:0;list-style:none}
.errlist li{border-bottom:1px solid var(--rule-soft);padding:11px 0;font-size:14px;color:var(--ink-soft)}
.errlist .rep{font-weight:700;color:var(--maths)}
.section-title{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  margin:22px 0 0
}

@media (max-width:420px){
  .tab{font-size:11px;letter-spacing:0;padding:10px 2px 9px}
}
@media (max-width:360px){
  .choice{font-size:16px}
  .choice.txt{font-size:13.5px}
  .tab{font-size:10px}
  .etiq,.bande li{font-size:12.5px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--maths);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar"><a class="home" href="maths.html">🏠 Maths</a><p class="eyebrow">Maths, 3<sup>e</sup></p></div>
    <h1>Thalès, <em>niveau brevet</em></h1>
    <p class="sub">Quatre entraînements : les calculs à étapes, la démonstration rédigée, l'agrandissement, les sujets complets.</p>
    <nav role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-panel="etapes">À étapes</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="rediger">Rédiger</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="agrandir">Agrandir</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="brevet">Brevet</button>
    </nav>
  </header>

  <div class="sheet">
    <section class="panel on" id="etapes"></section>
    <section class="panel" id="rediger"></section>
    <section class="panel" id="agrandir"></section>
    <section class="panel" id="brevet"></section>
  </div>
</div>

<script>
/* ============ outils ============ */
const $ = (sel,root=document)=>root.querySelector(sel);
const shuffle = a => {const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const pick = (a,n) => shuffle(a).slice(0,n);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function chrono(sec){return sec<60?sec+" s":Math.floor(sec/60)+" min "+String(sec%60).padStart(2,"0");}
const rnd=a=>a[Math.floor(Math.random()*a.length)];
function frac(a,b){return `<span class="frac"><span class="fn">${a}</span><span class="fd">${b}</span></span>`;}
function eq3(p){return p.map(([a,b])=>frac(a,b)).join(`<span class="egal">=</span>`);}

/* ============ moteurs ============ */
function figSVG(f){
  const lerp=(p,q,k)=>({x:p.x+(q.x-p.x)*k,y:p.y+(q.y-p.y)*k});
  const s=f.type==="papillon"?-1:1;
  const P={A:f.A,B:f.B,C:f.C};
  P.M=f.M||lerp(f.A,f.B,s*(f.t??.5));
  P.N=f.N||lerp(f.A,f.C,s*(f.tN??f.t??.5));
  const ks=["A","B","C","M","N"];
  const G={x:ks.reduce((v,k)=>v+P[k].x,0)/5,y:ks.reduce((v,k)=>v+P[k].y,0)/5};
  const nm=r=>(f.names&&f.names[r])||r;
  const seg=(p,q,cls)=>`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" class="${cls}"/>`;
  const norm=v=>{const d=Math.hypot(v.x,v.y)||1;return{x:v.x/d,y:v.y/d};};
  function chev(p,q){
    const u=norm({x:q.x-p.x,y:q.y-p.y}),n={x:-u.y,y:u.x},c=lerp(p,q,.5);
    let out="";
    [-3,4].forEach(o=>{
      const tip={x:c.x+u.x*o,y:c.y+u.y*o};
      out+=`<path class="chev" d="M ${tip.x-u.x*6+n.x*4.5} ${tip.y-u.y*6+n.y*4.5} L ${tip.x} ${tip.y} L ${tip.x-u.x*6-n.x*4.5} ${tip.y-u.y*6-n.y*4.5}"/>`;
    });
    return out;
  }
  let b="";
  if(f.type==="papillon"){b+=seg(P.M,P.B,"tr")+seg(P.N,P.C,"tr");}
  else{b+=seg(P.A,P.B,"tr")+seg(P.A,P.C,"tr");}
  b+=seg(P.B,P.C,"par"+(f.dash?" dash":""))+seg(P.M,P.N,"par"+(f.dash?" dash":""));
  if(f.par)b+=chev(P.M,P.N)+chev(P.B,P.C);
  (f.lens||[]).forEach(L=>{
    const p=P[L.a],q=P[L.b],mid=lerp(p,q,.5);
    const u=norm({x:q.x-p.x,y:q.y-p.y});
    let n={x:-u.y,y:u.x};
    if((mid.x+n.x*15-G.x)**2+(mid.y+n.y*15-G.y)**2 < (mid.x-n.x*15-G.x)**2+(mid.y-n.y*15-G.y)**2)n={x:-n.x,y:-n.y};
    const pos={x:mid.x+n.x*(L.d??15),y:mid.y+n.y*(L.d??15)};
    const unknown=L.v==="?";
    const txt=unknown?`${nm(L.a)}${nm(L.b)} = ?`:`${nm(L.a)}${nm(L.b)} = ${L.v}`;
    b+=`<text class="len${unknown?" unknown":""}" x="${pos.x}" y="${pos.y}" text-anchor="middle" dominant-baseline="middle">${txt}</text>`;
  });
  ks.forEach(k=>{
    const p=P[k], d=norm({x:p.x-G.x,y:p.y-G.y});
    b+=`<circle class="pt" cx="${p.x}" cy="${p.y}" r="2.6"/>`+
       `<text class="ptn" x="${p.x+d.x*13}" y="${p.y+d.y*13}" text-anchor="middle" dominant-baseline="middle">${nm(k)}</text>`;
  });
  return `<svg viewBox="0 0 320 212" role="img" aria-label="Figure de Thalès">${b}</svg>`;
}
function figDuoSVG(d){
  const norm=v=>{const l=Math.hypot(v.x,v.y)||1;return{x:v.x/l,y:v.y/l};};
  const COL=["#1B6F55","#DE5B4A","#457b9d"];
  let b="";
  d.tris.forEach(t=>{
    const P=t.P;
    const G={x:(P[0].x+P[1].x+P[2].x)/3,y:(P[0].y+P[1].y+P[2].y)/3};
    for(let i=0;i<3;i++){
      const p=P[i],q=P[(i+1)%3];
      b+=`<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}" class="tr"/>`;
    }
    (t.angs||[]).forEach(a=>{
      const p=P[a.at],u1=norm({x:P[(a.at+1)%3].x-p.x,y:P[(a.at+1)%3].y-p.y}),u2=norm({x:P[(a.at+2)%3].x-p.x,y:P[(a.at+2)%3].y-p.y});
      const r=13,s1={x:p.x+u1.x*r,y:p.y+u1.y*r},s2={x:p.x+u2.x*r,y:p.y+u2.y*r};
      const sweep=(u1.x*u2.y-u1.y*u2.x)>0?1:0;
      b+=`<path class="arc" stroke="${COL[a.c]}" d="M ${s1.x} ${s1.y} A ${r} ${r} 0 0 ${sweep} ${s2.x} ${s2.y}"/>`;
      if(a.v){
        const m=norm({x:u1.x+u2.x,y:u1.y+u2.y});
        b+=`<text class="ang" fill="${COL[a.c]}" x="${p.x+m.x*27}" y="${p.y+m.y*27}" text-anchor="middle" dominant-baseline="middle">${a.v}</text>`;
      }
    });
    (t.lens||[]).forEach(L=>{
      const p=P[L.a],q=P[L.b],mid={x:(p.x+q.x)/2,y:(p.y+q.y)/2};
      const u=norm({x:q.x-p.x,y:q.y-p.y});
      let n={x:-u.y,y:u.x};
      if((mid.x+n.x*13-G.x)**2+(mid.y+n.y*13-G.y)**2 < (mid.x-n.x*13-G.x)**2+(mid.y-n.y*13-G.y)**2)n={x:-n.x,y:-n.y};
      const pos={x:mid.x+n.x*(L.d??13),y:mid.y+n.y*(L.d??13)};
      const unknown=L.v==="?";
      const txt=`${P[L.a].n}${P[L.b].n} = ${unknown?"?":L.v}`;
      b+=`<text class="len${unknown?" unknown":""}" x="${pos.x}" y="${pos.y}" text-anchor="middle" dominant-baseline="middle">${txt}</text>`;
    });
    P.forEach(p=>{
      const dr=norm({x:p.x-G.x,y:p.y-G.y});
      b+=`<circle class="pt" cx="${p.x}" cy="${p.y}" r="2.6"/>`+
         `<text class="ptn" x="${p.x+dr.x*13}" y="${p.y+dr.y*13}" text-anchor="middle" dominant-baseline="middle">${p.n}</text>`;
    });
  });
  return `<svg viewBox="0 0 320 212" role="img" aria-label="Deux triangles">${b}</svg>`;
}

/* ============ donnees ============ */
const TRI={type:"triangle",A:{x:165,y:26},B:{x:38,y:188},C:{x:295,y:188}};
const TRI2={type:"triangle",A:{x:120,y:30},B:{x:30,y:190},C:{x:300,y:170}};
const PAP={type:"papillon",A:{x:165,y:100},B:{x:35,y:192},C:{x:300,y:178}};
/* Deux configurations propres à ce carnet : un objet vertical et son ombre (MUR), et une pente
   douce (RAMPE). Elles ne reprennent pas l'OMB de thales.html, dont les points touchent le bord
   droit du cadre : mesuré, il ne reste alors pas la place d'écrire l'étiquette du côté vertical,
   qui se fait couper. Les marges ci-dessous sont dimensionnées pour la plus longue (« BC = 2,4 m »). */
const MUR={type:"triangle",A:{x:34,y:170},B:{x:238,y:170},C:{x:238,y:40}};
const RAMPE={type:"triangle",A:{x:30,y:176},B:{x:250,y:176},C:{x:250,y:112}};

/* 1. les calculs a etapes : aucune question ne se regle en une operation */
const ETAPES=[
  {f:{...TRI,t:.375,par:true,lens:[{a:"A",b:"M",v:"3",d:15},{a:"M",b:"B",v:"5",d:15},{a:"A",b:"N",v:"4,5",d:15},{a:"A",b:"C",v:"?",d:26}]},
   q:"M ∈ [AB], N ∈ [AC], (MN) // (BC). Longueurs en cm. <em>Calcule AC.</em>",
   ans:12,unit:"cm",rep:"AC = 12 cm",
   w:`AB n'est pas donné : il faut le reconstituer. <em>AB = AM + MB = 3 + 5 = 8 cm.</em> D'après le théorème de Thalès : ${eq3([["AM","AB"],["AN","AC"]])}, donc ${eq3([["3","8"],["4,5","AC"]])}. Produit en croix : AC = (8 × 4,5) ÷ 3 = <em>12 cm</em>.`},

/* ============ gamification ============ */
const SHEET_URL="https://script.google.com/macros/s/AKfycbwB53nfh6Xk_z1Gn4ck_WL8aX0gPxDzQ2MpxWVnpsdunmWR_IKj-tHPHOEVkP614jQJ/exec";
function appareil(){
  const ua=navigator.userAgent, n=navigator, e=screen;
  const tactile=(n.maxTouchPoints||0)>0, cote=Math.max(e.width,e.height);
  const os=/iPhone|iPod/.test(ua)?"iOS":/iPad/.test(ua)?"iPadOS":/Android/.test(ua)?"Android":/Windows/.test(ua)?"Windows":/Mac OS X/.test(ua)?(tactile?"iPadOS":"macOS"):/Linux/.test(ua)?"Linux":"autre";
  let nom="autre";
  for(const [cle,val] of [["Edg","Edge"],["OPR","Opera"],["CriOS","Chrome"],["FxiOS","Firefox"],["Firefox","Firefox"],["Chrome","Chrome"],["Version","Safari"]]){
    const m=ua.match(new RegExp(cle+"\\/(\\d+)")); if(m){nom=val+" "+m[1];break;}
  }
  const type=!tactile?"ordinateur":(os==="iPadOS"||(os==="Android"&&!/Mobile/.test(ua))||cote>=1000)?"tablette":"mobile";
  return {appareil:type,os,navigateur:nom,ecran:e.width+"x"+e.height,fenetre:innerWidth+"x"+innerHeight,dpr:devicePixelRatio||1,tactile,langue:n.language||"",ua};
}
function logResult(game,score,good,total,secs){
  try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify(Object.assign({page:"thales-brevet",game,score,good,total,secs},appareil()))});}catch(e){}
}
const CHEERS=[["🎉","Bravo !"],["⭐","Super !"],["🚀","Excellent !"],["🏆","Champion !"],["📐","Thalès applaudit !"],["🔥","Trop fort !"],["🌟","Génial !"],["🧮","Compte rond, bien joué !"]];
const OOPS=[["😅","Oups, presque !"],["🙈","Pas cette fois !"],["🤔","Hmm, relis l'énoncé..."],["🐢","On y va doucement !"],["🧐","Presque ! Lis la correction."]];
function confetti(host){
  const cols=["#e63946","#f4a261","#2a9d8f","#457b9d","#ffd166","#9b5de5","#06d6a0"];
  for(let i=0;i<22;i++){
    const p=document.createElement("i");p.className="confetti";
    const ang=Math.random()*Math.PI*2, d=60+Math.random()*90;
    p.style.setProperty("--dx",Math.cos(ang)*d+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*d-40)+"px");
    p.style.background=rnd(cols);
    p.style.animationDelay=(Math.random()*.15)+"s";
    host.appendChild(p);
  }
}
function bilanHTML(st,titreOk){
  const good=st.list.length-st.errs.length;
  return `<div class="bilan">
    <h2>${good===st.list.length?"🏆 Sans faute, incroyable !":good>=st.list.length*.8?"🌟 Bravo, belle manche !":good>=st.list.length/2?"👍 Pas mal du tout !":"💪 Continue, tu progresses !"}</h2>
    <p class="bigscore">${st.score}</p>
    <p class="meta">${good} bonnes réponses sur ${st.list.length}, en ${chrono(st.secs)}.</p>
    ${st.errs.length?`<p class="section-title">À revoir</p><ul class="errlist">${st.errs.map(e=>`
      <li><span class="rep">${e.rep}</span> ${e.w}</li>`).join("")}</ul>`
    :`<p class="section-title">Sans faute</p><p style="margin-top:8px">${titreOk}</p>`}
    <div class="row-end"><button class="btn ghost" id="again">Nouvelle manche</button></div>
  </div>`;
}

/* ============ le constructeur de manche ============ */
/* Reprend celui des carnets de physique-chimie, avec deux ajouts :
   - kind "ordre" : remettre des etiquettes dans le bon ordre, une intruse dans le tas ;
   - o.deplier : une entree de donnees peut produire plusieurs questions consecutives, qui
     restent groupees et dans leur ordre (manche Brevet). */
function creeManche(o){
  const st={list:[],i:0,score:0,errs:[],t0:0,streak:0,secs:0};
  const hote=$(o.panel);
  function verdict(ok){
    const v=hote.querySelector(".react");
    const [emo,msg]=ok?rnd(CHEERS):rnd(OOPS);
    st.streak=ok?st.streak+1:0;
    v.className="react "+(ok?"yes":"no");
    v.innerHTML=`<span class="emo" role="img" aria-label="${ok?"Bonne réponse":"Mauvaise réponse"}">${emo}</span><span class="msg">${msg}</span>`+
      (st.streak>=3?`<span class="streak">🔥 ${st.streak} d'affilée !</span>`:"");
    if(ok)confetti(v);
  }
  function intro(){
    hote.innerHTML=`<div class="intro"><h2>${o.titre}</h2><p>${o.texte}</p><button class="btn">Commencer la manche</button></div>`;
    hote.querySelector(".btn").onclick=lance;
  }
  function lance(){
    const base=o.tirage?o.tirage(o.donnees):shuffle(o.donnees);
    st.list=o.deplier?base.flatMap(o.deplier):base;
    st.i=0;st.score=0;st.errs=[];st.streak=0;st.t0=Date.now();etape();
  }
  function etape(){
    if(st.i>=st.list.length)return fin();
    const q=(o.prep||(x=>x))(st.list[st.i]);
    hote.innerHTML=`
      <div class="status"><span>Question <b>${st.i+1}</b>/${st.list.length}</span><span class="grow"></span><span>Points <b class="pts">${st.score}</b></span></div>
      <div class="carte">
        <div class="react"></div>
        <p class="annot">${q.annot}</p>
        ${q.contexte?`<p class="contexte">${q.contexte}</p>`:""}
        ${q.fig?`<div class="fig">${q.fig}</div><p class="echelle">Figure pas à l'échelle</p>`:""}
        ${q.rappel?`<span class="rappel">${q.rappel}</span>`:""}
        <p class="hyp">${q.q}</p>
        <p class="why"></p>
      </div>
      ${zoneReponse(q)}
      <div class="row-end"><button class="btn hidden suiv">Suivante</button></div>`;
    function revele(ok,saisie){
      verdict(ok);
      hote.querySelector(".carte").classList.add("revealed");
      hote.querySelector(".annot").textContent=q.rep;
      hote.querySelector(".why").innerHTML=(ok?"":`<em>Non${saisie?", tu as répondu "+saisie:""}. </em>`)+q.w;
      hote.querySelector(".pts").textContent=st.score;
      const n=hote.querySelector(".suiv");n.classList.remove("hidden");
      n.textContent=st.i===st.list.length-1?"Voir le bilan":"Suivante";
      n.onclick=()=>{st.i++;etape();};
      n.focus({preventScroll:true});
    }
    function compte(ok){
      if(ok)st.score+=10;else st.errs.push({rep:q.rep,w:q.w});
    }
    if(q.kind==="num")brancheSaisie(q,compte,revele);
    else if(q.kind==="ordre")brancheOrdre(q,compte,revele);
    else brancheQcm(q,compte,revele);
  }
  function zoneReponse(q){
    if(q.kind==="num")
      return `<div class="answer"><input inputmode="decimal" autocomplete="off" placeholder="Ta réponse"><span class="unit">${q.unit}</span><button class="btn ok">Valider</button></div>`;
    if(q.kind==="ordre")
      return `<ol class="bande"></ol><p class="vide">Tape les étapes dans l'ordre. Une étiquette de trop s'est glissée dans la liste.</p>
        <div class="tas">${q.melange.map((t,k)=>`<button class="etiq" data-k="${k}">${t}</button>`).join("")}</div>
        <div class="row-end"><button class="btn valider" disabled>Valider</button></div>`;
    return `<div class="choices-eq">${q.ch.map((c,k)=>`<button class="choice${q.txt?" txt":""}" data-k="${k}">${c}</button>`).join("")}</div>`;
  }
  function brancheSaisie(q,compte,revele){
    const input=hote.querySelector(".answer input");input.focus({preventScroll:true});
    function valider(){
      const v=parseFloat(input.value.replace(",",".").trim());
      if(!isFinite(v)){input.value="";input.placeholder="Écris un nombre";return;}
      const ok=Math.abs(v-q.ans)<=0.011;
      compte(ok);
      input.disabled=true;hote.querySelector(".answer .btn").disabled=true;
      revele(ok,esc(input.value));
    }
    hote.querySelector(".answer .btn").onclick=valider;
    input.addEventListener("keydown",e=>{if(e.key==="Enter")valider();});
  }
  function brancheQcm(q,compte,revele){
    hote.querySelectorAll(".choice").forEach(b=>{
      b.onclick=()=>{
        const ok=+b.dataset.k===q.good;
        compte(ok);
        hote.querySelectorAll(".choice").forEach(x=>{
          x.disabled=true;
          if(+x.dataset.k===q.good)x.classList.add("good");
          else if(x===b)x.classList.add("bad");
          else x.classList.add("dim");
        });
        revele(ok,"");
      };
    });
  }
  function brancheOrdre(q,compte,revele){
    const bande=hote.querySelector(".bande"), tas=hote.querySelector(".tas"),
          vide=hote.querySelector(".vide"), valider=hote.querySelector(".valider");
    const choisi=[];
    function dessine(){
      bande.innerHTML=choisi.map((k,rang)=>`<li data-rang="${rang}">${q.melange[k]}</li>`).join("");
      vide.classList.toggle("hidden",choisi.length>0);
      tas.querySelectorAll(".etiq").forEach(b=>b.classList.toggle("used",choisi.includes(+b.dataset.k)));
      valider.disabled=choisi.length===0;
      bande.querySelectorAll("li").forEach(li=>{
        li.onclick=()=>{choisi.splice(+li.dataset.rang,1);dessine();};
      });
    }
    tas.querySelectorAll(".etiq").forEach(b=>{
      b.onclick=()=>{const k=+b.dataset.k;if(!choisi.includes(k)){choisi.push(k);dessine();}};
    });
    dessine();
    valider.onclick=()=>{
      const rendu=choisi.map(k=>q.melange[k]);
      const ok=rendu.length===q.etapes.length && rendu.every((t,i)=>t===q.etapes[i]);
      compte(ok);
      tas.querySelectorAll(".etiq").forEach(b=>b.disabled=true);
      valider.disabled=true;
      bande.querySelectorAll("li").forEach((li,rang)=>{
        li.onclick=null;li.classList.add("fige");
        if(rendu[rang]!==q.etapes[rang])li.classList.add("bad");
      });
      revele(ok,"");
    };
  }
  function fin(){
    st.secs=Math.round((Date.now()-st.t0)/1000);
    logResult(o.game,st.score,st.list.length-st.errs.length,st.list.length,st.secs);
    hote.innerHTML=bilanHTML(st,o.bravo);
    hote.querySelector("#again").onclick=lance;
  }
  return {intro};
}

/* ============ les manches ============ */

    titre:"Deux opérations, pas une.",

    bravo:"Rien à revoir. Passe à Rédiger : au contrôle, le résultat seul ne rapporte presque rien.",
    prep:q=>({...q,kind:"num",annot:"À toi de calculer",fig:figSVG(q.f)})}),

  rediger:creeManche({panel:"#rediger",game:"rediger",donnees:REDACTIONS,
    titre:"La démonstration, dans l'ordre.",
    texte:"Six démonstrations mises en pièces. Remets les étapes dans l'ordre, et laisse de côté l'étiquette qui n'a rien à faire là. C'est exactement ce qu'on attend de toi sur une copie.",
    bravo:"Rien à revoir. Tu sais rédiger : direction les agrandissements.",
    prep:q=>({...q,kind:"ordre",annot:"Remets la démonstration dans l'ordre",
      fig:q.f?figSVG(q.f):(q.duo?figDuoSVG(q.duo):null),

      rep:"La démonstration, dans l'ordre :",
      w:`<ol class="demo">${q.etapes.map(e=>`<li>${e}</li>`).join("")}</ol><p style="margin:8px 0 0"><em>L'intruse :</em> « ${q.intrus} » ${q.pourquoi}</p>`})}),

  agrandir:creeManche({panel:"#agrandir",game:"agrandir",donnees:AGRANDIR,

    texte:"Huit questions sur l'agrandissement et la réduction. Les longueurs suivent k, les aires k², les volumes k³ : tout l'enjeu est de savoir lequel des trois s'applique.",
    bravo:"Rien à revoir. Dernière manche : des sujets entiers, comme au brevet.",
    prep:q=>({...q,annot:q.kind==="num"?"À toi de calculer":"Agrandir ou réduire",fig:null})}),

  brevet:creeManche({panel:"#brevet",game:"brevet",donnees:SUJETS,

    bravo:"Rien à revoir. Thalès, sa réciproque, les agrandissements, les sujets complets : le chapitre est à toi.",
    tirage:d=>pick(d,3),
    deplier:s=>s.questions.map((q,i)=>({...q,
      annot:s.titre,
      contexte:i===0?s.contexte:null,
      fig:s.fig?figSVG(s.fig):(s.duo?figDuoSVG(s.duo):null),
      rappel:i===0?null:s.questions[i-1].rappel,
      txt:true})),
  }),
  /* fin des manches */
};

document.querySelectorAll(".tab").forEach(t=>{
