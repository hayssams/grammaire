<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La boîte à astuces</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F1;
  --paper-2:#FCFCFA;
  --rule:#BFD3E4;
  --rule-soft:#DDE7F0;
  --marge:#DE5B4A;
  --ink:#16233B;
  --ink-soft:#5E6E85;
  --classes:#1D4E89;
  --fonctions:#1B6F55;
  --nom:#1D4E89;
  --verbe:#BE2F28;
  --adjectif:#1B6F55;
  --determinant:#B8651A;
  --pronom:#654AA3;
  --adverbe:#0E6F80;
  --preposition:#836517;
  --conjonction:#9C3670;
  --interjection:#C07E00;
  --sujet:#1D4E89;
  --cod:#BE2F28;
  --coi:#C0631A;
  --attribut:#1B6F55;
  --cc:#0E6F80;
  --epithete:#654AA3;
  --cdn:#9C3670;
  --apposition:#7C6320;
  --agent:#4F6B2E;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  padding:0 0 40px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- en-tete ---------- */
header{padding:26px 0 14px}
.topbar{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.topbar .eyebrow{margin:0}
.home{
  font-family:var(--sans);font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;padding:6px 12px;background:var(--paper,transparent);
  transition:background .2s,transform .2s
}
.home:hover{background:var(--rule-soft);transform:translateY(-1px)}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;margin:0 0 6px
}
h1{
  font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;
  margin:0 0 4px;letter-spacing:-.01em
}
h1 em{font-style:italic;color:var(--marge)}
.sub{margin:0;color:var(--ink-soft);font-size:14px}

/* ---------- onglets ---------- */
nav{display:flex;gap:6px;margin:18px 0 0;align-items:flex-end}
.tab{
  flex:1;border:1px solid var(--rule);border-bottom:none;
  background:#EDEFE9;color:var(--ink-soft);
  font-family:var(--sans);font-size:12.5px;font-weight:700;
  padding:11px 3px 10px;border-radius:9px 9px 0 0;cursor:pointer;
  letter-spacing:.01em;transition:background .15s,color .15s,transform .15s
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper-2);color:var(--ink);transform:translateY(1px)}
.tab[aria-selected="true"][data-panel="classes"]{box-shadow:0 -2px 0 var(--classes) inset}
.tab[aria-selected="true"][data-panel="fonctions"]{box-shadow:0 -2px 0 var(--fonctions) inset}

/* ---------- feuille ---------- */
.sheet{
  position:relative;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:0 0 10px 10px;
  padding:22px 16px 20px 30px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px);
  background-position:0 8px;
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:20px;width:1px;background:var(--marge);opacity:.5
}
.panel{display:none}
.panel.on{display:block}

/* ---------- cartes d'astuce ---------- */
.astuce{border:1px solid var(--rule);border-left:3px solid var(--c);background:var(--paper-2);
  border-radius:8px;padding:14px 14px 12px;margin:0 0 12px}
.astuce h2{font-family:var(--serif);font-weight:400;font-size:22px;margin:0 0 4px;color:var(--c)}
.astuce .truc{margin:0 0 10px;font-size:14.5px}
.astuce .truc strong{color:var(--ink)}
.astuce ul.ex{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.astuce ul.ex li{font-family:var(--serif);font-size:17px;line-height:1.35;padding-left:14px;position:relative}
.astuce ul.ex li::before{content:"\2013";position:absolute;left:0;color:var(--ink-soft)}
.cible{color:var(--c);border-bottom:2px solid var(--c);font-style:normal}
.note-ex{font-family:var(--sans);font-size:12.5px;color:var(--ink-soft)}
.section-title{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);margin:22px 0 10px}
.vs{border:1px dashed var(--rule);border-radius:8px;background:var(--paper-2);
  padding:14px 14px 12px;margin:0 0 12px}
.vs h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 4px}
.vs .truc{margin:0 0 10px;font-size:14.5px}
.vs ul.ex{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.vs ul.ex li{font-family:var(--serif);font-size:16.5px;padding-left:14px;position:relative}
.vs ul.ex li::before{content:"\2013";position:absolute;left:0;color:var(--ink-soft)}

@media (max-width:420px){
  h1{font-size:29px}
  .sheet{padding-left:26px}
}
@media (max-width:360px){
  .astuce ul.ex li{font-size:16px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--classes);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar"><a class="home" href="index.html">🏠 Accueil</a><p class="eyebrow">Français, 3<sup>e</sup></p></div>
    <h1>Des trucs pour ne plus <em>hésiter</em></h1>
    <p class="sub">Pour chaque classe et chaque fonction, un test concret et des exemples. À consulter avant ou pendant les exercices.</p>
    <nav role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-panel="classes">Classes</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="fonctions">Fonctions</button>
    </nav>
  </header>

  <div class="sheet">
    <section class="panel on" id="classes"></section>
    <section class="panel" id="fonctions"></section>
  </div>
</div>

<script>
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===t.dataset.panel));
    window.scrollTo({top:0});
  });
});
</script>
</body>
</html>
