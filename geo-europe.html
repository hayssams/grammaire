<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>L'Europe et l'Union</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F1;
  --paper-2:#FCFCFA;
  --rule:#BFD3E4;
  --rule-soft:#DDE7F0;
  --marge:#DE5B4A;
  --ink:#16233B;
  --ink-soft:#5E6E85;
  --geo:#17697B;
  --terre:#DCE7DB;
  --terre-2:#C6D8C4;
  --eau:#CFE2EE;
  --relief:#C9A98C;
  --mer:#9FC6DE;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  padding:0 0 40px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- en-tete ---------- */
header{padding:26px 0 14px}
.topbar{display:flex;align-items:center;gap:14px;margin:0 0 6px}
.topbar .eyebrow{margin:0}
.home{
  font-family:var(--sans);font-size:13px;font-weight:700;text-decoration:none;color:var(--ink);
  border:1px solid var(--rule);border-radius:999px;padding:6px 12px;background:var(--paper,transparent);
  transition:background .2s,transform .2s
}
.home:hover{background:var(--rule-soft);transform:translateY(-1px)}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;margin:0 0 6px
}
h1{
  font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;
  margin:0 0 4px;letter-spacing:-.01em
}
h1 em{font-style:italic;color:var(--geo)}
.sub{margin:0;color:var(--ink-soft);font-size:14px}

/* ---------- onglets ---------- */
nav{display:flex;gap:6px;margin:18px 0 0;align-items:flex-end}
.tab{
  flex:1;border:1px solid var(--rule);border-bottom:none;
  background:#EDEFE9;color:var(--ink-soft);
  font-family:var(--sans);font-size:12.5px;font-weight:700;
  padding:11px 3px 10px;border-radius:9px 9px 0 0;cursor:pointer;
  letter-spacing:.01em;transition:background .15s,color .15s,transform .15s
}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{background:var(--paper-2);color:var(--ink);transform:translateY(1px);box-shadow:0 -2px 0 var(--geo) inset}

/* ---------- feuille ---------- */
.sheet{
  position:relative;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:0 0 10px 10px;
  padding:22px 16px 20px 30px;overflow:hidden;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px);
  background-position:0 8px;
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:20px;width:1px;background:var(--marge);opacity:.5
}
.panel{display:none}
.panel.on{display:block}

/* ---------- barre d'etat ---------- */
.status{
  display:flex;align-items:center;gap:12px;
  font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-soft);margin-bottom:14px
}
.status .grow{flex:1}
.status b{color:var(--ink);font-size:14px;letter-spacing:0}

.hyp{font-size:14.5px;margin:0 0 6px}
.hyp em{font-style:normal;font-weight:700}
.annot{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink-soft);transition:color .3s ease;margin:0 0 4px
}
.revealed .annot{color:var(--geo)}

/* ---------- reactions ---------- */
.react{text-align:center;min-height:78px;margin:0 0 8px;position:relative}
.react .emo{display:inline-block;font-size:48px;line-height:52px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.react .msg{display:block;font-family:var(--sans);font-weight:800;font-size:16px;line-height:22px;letter-spacing:.02em;animation:pop .45s .1s both cubic-bezier(.2,1.6,.4,1)}
.react.yes .msg{color:var(--geo)}
.react.no .msg{color:var(--marge)}
.react.no .emo{animation:shake .5s ease}
.react .streak{display:block;font-family:var(--sans);font-size:12px;font-weight:700;color:var(--ink-soft);margin-top:2px;animation:pop .4s .25s both}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px) rotate(-8deg)}40%,80%{transform:translateX(8px) rotate(8deg)}}
.confetti{position:absolute;left:50%;top:26px;width:9px;height:9px;border-radius:2px;pointer-events:none;animation:fly .9s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.why{font-size:14px;color:var(--ink-soft);margin:8px 0 0;opacity:0;transition:opacity .3s .3s}
.revealed .why{opacity:1}
.why em{font-style:normal;color:var(--ink);font-weight:700}

/* ---------- choix ---------- */
.judge{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.judge .btn{width:100%;text-align:center}
.judge .no{background:transparent;color:var(--marge);border-color:var(--marge)}
.judge .btn.good{background:var(--geo);border-color:var(--geo);color:#fff;opacity:1}
.judge .btn.bad{background:transparent;border-color:var(--marge);color:var(--marge);text-decoration:line-through;opacity:1}
.judge .btn.dim{opacity:.35}
.choices{display:grid;gap:8px;margin:18px 0 0}
.choice{
  border:1px solid var(--rule);background:var(--paper-2);color:var(--ink);
  font-family:var(--sans);font-size:14.5px;font-weight:700;line-height:1.3;
  padding:13px 12px;border-radius:7px;cursor:pointer;text-align:left;
  transition:background .12s,border-color .12s,color .12s,opacity .2s
}
.choice:hover:not(:disabled){border-color:var(--ink);background:#F1F3EE}
.choice:disabled{cursor:default}
.choice.dim{opacity:.32}
.choice.good{background:var(--geo);border-color:var(--geo);color:#fff;opacity:1}
.choice.bad{background:transparent;border-color:var(--marge);color:var(--marge);opacity:1;text-decoration:line-through}

/* ---------- cartes ---------- */
.fig .repere{fill:none;stroke:var(--ink);stroke-width:1.4;opacity:.55;pointer-events:none}
.fig .good .repere{stroke:var(--geo);opacity:1;stroke-width:2}
.fig .bad .repere{stroke:var(--marge);opacity:1;stroke-width:2}
.fig .dim .repere{opacity:.25}
/* Toutes les epaisseurs de trait sont exprimees en pixels rendus et non en unites
   de viewBox : sans cela la loupe les multiplie. Un liseré de 1,5 unite autour
   d'une pastille devenait un disque blanc de 43 px dans le cadre « antilles ». */
.fig svg *{vector-effect:non-scaling-stroke}
.enonce{font-family:var(--serif);font-size:26px;line-height:1.15;color:var(--geo);margin:6px 0 14px}
.fig{margin:14px 0 4px;text-align:center}
.fig svg{width:100%;max-width:340px;height:auto;background:var(--eau);border-radius:8px}
.fig .z path{fill:var(--terre);stroke:var(--paper-2);stroke-width:1.2;cursor:pointer;transition:fill .15s}
.fig .z.trait path:not(.cible-trait){stroke:#3E7CA8;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round;fill:none}
/* la cible d'un fleuve : invisible, epaisse, pour qu'on le tape sur toute sa longueur */
.fig .z.trait path.cible-trait{stroke:transparent;stroke-width:11;fill:none;cursor:pointer}
.fig .z.point circle:not(.halo){fill:var(--ink);stroke:var(--paper-2);stroke-width:1.5}
.fig .halo{fill:transparent;cursor:pointer}
.fig .z:hover path{fill:var(--terre-2)}
.fig .z:focus{outline:none}
.fig .z:focus path{stroke:var(--ink);stroke-width:2}
.fig .z.vise path{fill:var(--geo)}
.fig .z.vise.trait path:not(.cible-trait),.fig .z.vise.point circle:not(.halo){stroke:var(--geo);fill:var(--geo)}
.fig .z.good path{fill:var(--geo);stroke:var(--ink);stroke-width:2}
.fig .z.good.trait path:not(.cible-trait){stroke:var(--geo);stroke-width:4;fill:none}
.fig .z.bad path{fill:var(--marge);opacity:.55}
.fig .z.bad.trait path:not(.cible-trait){stroke:var(--marge);stroke-width:4;fill:none}
.fig .z.dim path{opacity:.75}
.fig .z.horsue path{fill:#E2E0DA}
.fig .zlab{font-family:var(--sans);font-size:7.5px;font-weight:700;fill:var(--ink-soft);pointer-events:none}
.fig .z.inerte path,.fig .z.inerte circle{fill:var(--terre);stroke:var(--paper-2);stroke-width:1;cursor:default;pointer-events:none;opacity:.6}
#relief .fig .z.aire:not(.inerte) path{fill:var(--relief);opacity:.75}
#relief .fig .z.aire.good:not(.inerte) path{opacity:1}
#outremer .fig .z.aire:not(.inerte) path{fill:var(--mer);stroke:#6E9DBD;stroke-width:1;opacity:.82}
#outremer .fig .z.aire:not(.inerte).good path{opacity:1}
.fig .retour{margin-top:10px}
.revealed .fig .z path,.revealed .fig .halo{cursor:default}
@media (prefers-reduced-motion:reduce){
  .fig .z path{transition:none}
}
.credit{margin:14px 0 0;font-size:11px;color:var(--ink-soft);text-align:center}

/* ---------- boutons ---------- */
.btn{
  display:inline-block;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);
  font-family:var(--sans);font-size:15px;font-weight:700;padding:12px 22px;border-radius:8px;cursor:pointer;
  transition:opacity .15s
}
.btn:hover{opacity:.86}
.btn:disabled{cursor:default}
.btn.ghost{background:transparent;color:var(--ink)}
.row-end{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;min-height:46px;align-items:center}
.hidden{display:none !important}

/* ---------- accueil de manche ---------- */
.intro{padding:6px 0 4px}
.intro h2{font-family:var(--serif);font-weight:400;font-size:27px;margin:0 0 8px;line-height:1.15}
.intro p{margin:0 0 18px;color:var(--ink-soft);font-size:15px;max-width:44ch}

/* ---------- bilan ---------- */
.bilan h2{font-family:var(--serif);font-weight:400;font-size:30px;margin:0 0 2px}
.bigscore{font-family:var(--serif);font-size:56px;line-height:1;margin:10px 0 2px}
.bilan .meta{color:var(--ink-soft);font-size:14px;margin:0 0 18px}
.errlist{border-top:1px solid var(--rule-soft);margin:14px 0 0;padding:0;list-style:none}
.errlist li{border-bottom:1px solid var(--rule-soft);padding:11px 0;font-size:14px;color:var(--ink-soft)}
.errlist .rep{font-weight:700;color:var(--geo)}
.section-title{
  font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);
  margin:22px 0 0
}

@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
:focus-visible{outline:2px solid var(--geo);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="topbar"><a class="home" href="geographie.html">🏠 Géographie</a><p class="eyebrow">Géographie, 3<sup>e</sup></p></div>
    <h1>L'Europe <em>et son Union</em></h1>
    <p class="sub">Quatre entraînements : placer les pays de l'Union, les reconnaître, savoir qui en est membre, retrouver les voisins de la France.</p>
    <nav role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-panel="placer">Placer</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="nommer">Reconnaître</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="membre">Dans l'UE ?</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="voisins">Les voisins</button>
    </nav>
  </header>

  <div class="sheet">
    <section class="panel on" id="placer"></section>
    <section class="panel" id="nommer"></section>
    <section class="panel" id="membre"></section>
    <section class="panel" id="voisins"></section>
  </div>
</div>

<script>
/* ============ outils ============ */
const $ = (sel,root=document)=>root.querySelector(sel);
const shuffle = a => {const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;};
const pick = (a,n) => shuffle(a).slice(0,n);
const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
function chrono(sec){return sec<60?sec+" s":Math.floor(sec/60)+" min "+String(sec%60).padStart(2,"0");}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ============ moteur de cartes ============ */
/* Un fond = {viewBox, zones:[{id,nom,d,cx,cy,type,dmin,petit}]}.
   type "aire"  : polygone plein, cliquable sur toute sa surface.
   type "trait" : polyligne (un fleuve), cliquable via un halo.
   type "point" : repere ponctuel (une ville, une ile), cliquable via un halo.
   La cible tactile depend du type, et c'est ce qui rend la carte jouable au doigt :
     - "aire"  : le polygone lui-meme, plus un halo circulaire pour les zones "petit" ;
     - "trait" : le trace repris en transparent avec une forte epaisseur, si bien
                 qu'un fleuve se tape n'importe ou sur sa longueur ;
     - "point" : un halo circulaire centre sur cx,cy.
   Mesure faite sur les vrais fonds : sans cela l'Ile-de-France tombe a 34 px, le
   Luxembourg a 8 px et la Guadeloupe a 1 px.
   Mais poser un halo sur *toutes* les zones deborde : mesure faite sur la carte
   en ligne, 4.3% des clics a l'interieur d'une region resolvaient a une autre
   region. Le halo n'est donc pose que sur les zones marquees "petit" dans les
   donnees, et son rayon est plafonne par `dmin`, la distance a l'ancre voisine
   la plus proche : ainsi un halo ne peut jamais mordre sur le clic d'une autre
   zone. */
const HALO_PX=22,POINT_PX=4;
/* La carte est rendue sur environ 284px de large sur un telephone (mesure faite,
   c'est aussi l'hypothese de cartes.mjs). La loupe retrecit le viewBox sans
   changer cette largeur de rendu : un rayon fixe en unites de viewBox donnerait
   donc un halo minuscule sur la carte entiere et demesure une fois zoome ; une
   pastille de 4,5 unites s'afficherait a 258px dans le cadre "antilles". `unite`
   convertit donc un pixel rendu en unites du viewBox courant. */
const RENDU_PX=284;
function unite(vb){return Number(vb.split(/\s+/)[2])/RENDU_PX;}
function rayonHalo(z,u){
  const r=HALO_PX*u;
  return z.dmin!=null?Math.min(r,z.dmin*0.45):r;
}
/* Les zones "petit" sont peintes en dernier au sein de leur type, donc au-dessus :
   sinon leur halo se fait recouvrir par une voisine dessinee apres elles - c'est
   ce qui faisait tomber l'Ile-de-France a 7% de sa propre surface. Le tri se fait
   par type pour ne pas deplacer les fleuves, qui doivent rester dessines apres
   tous les reliefs quel que soit leur statut "petit". Les zones inertes n'ont
   jamais de halo (voir plus bas) : leur ordre n'a pas besoin d'etre touche. */
function zonesTriees(zones){
  const types=[...new Set(zones.map(z=>z.type))];
  return types.flatMap(t=>{
    const g=zones.filter(z=>z.type===t);
    return [...g.filter(z=>!(z.petit&&!z.inerte)),...g.filter(z=>z.petit&&!z.inerte)];
  });
}
function mapSVG(fond,opts={}){
  const {bonne,choisie,surligne,etiquettes,montrerUE}=opts;
  const vb=opts.vb||fond.viewBox;
  const u=unite(vb);
  const corps=zonesTriees(fond.zones).map(z=>{
    let cls="z "+z.type;
    if(surligne&&z.id===surligne)cls+=" vise";
    if(bonne&&z.id===bonne)cls+=" good";
    else if(choisie&&z.id===choisie)cls+=" bad";
    else if(bonne)cls+=" dim";
    /* la distinction membre/non-membre ne s'affiche que si on la demande : sinon
       la manche « Dans l'UE ou pas ? » se repondrait a la couleur, sans reflechir. */
    if(montrerUE&&z.ue===false)cls+=" horsue";
    if(z.inerte){
      const forme=z.type==="point"
        ? `<circle cx="${z.cx}" cy="${z.cy}" r="${(POINT_PX*0.7*u).toFixed(2)}"></circle>`
        : `<path d="${z.d}"></path>`;
      return `<g class="z inerte ${z.type}">${forme}</g>`;
    }
    /* l'epaisseur de la cible se met dans le CSS, pas en attribut : une regle CSS
       l'emporte toujours sur un attribut de presentation, quelle que soit sa
       specificite, donc un stroke-width inline serait purement decoratif. */
    const forme=z.type==="trait"
      ? `<path class="cible-trait" d="${z.d}" fill="none"></path>`+
        `<path d="${z.d}" fill="none"></path>`
      : z.type==="point"
        ? `<circle cx="${z.cx}" cy="${z.cy}" r="${(POINT_PX*u).toFixed(2)}"></circle>`
        : `<path d="${z.d}"></path>`;
    /* Une zone trop petite pour se voir recoit, en plus de son halo tactile, un
       repere annulaire : sans lui Mayotte s'affiche sur 2 px dans son cadre et
       l'eleve vise un point invisible. Rayon en pixels rendus, comme le halo. */
    const halo=z.petit?`<circle class="repere" cx="${z.cx}" cy="${z.cy}" r="${(7*u).toFixed(2)}"></circle>`+
      `<circle class="halo" cx="${z.cx}" cy="${z.cy}" r="${rayonHalo(z,u).toFixed(2)}"></circle>`:"";
    const nom=etiquettes?`<text x="${z.cx}" y="${z.cy+3}" text-anchor="middle" class="zlab">${esc(z.nom)}</text>`:"";
    return `<g class="${cls}" data-z="${z.id}" role="button" tabindex="0" aria-label="${esc(z.nom)}">
      ${forme}${halo}${nom}</g>`;
  }).join("");
  return `<svg viewBox="${vb}" role="img" aria-label="Carte cliquable">${corps}</svg>`;
}
/* ---- la loupe ----
   Sur une carte dense, viser au doigt est impossible : mesure faite, le Luxembourg
   offre 8 px et la Guadeloupe 1 px. Un premier appui resserre donc le viewBox
   autour du point vise, un second designe la zone. `cadreSur` sert aussi a montrer
   de pres un pays surligne dans les manches ou l'eleve repond par un bouton.
   Le facteur de zoom depend du fond : deux zones proches ne demandent pas le
   meme grossissement pour atteindre 44 px selon la densite de la carte. */
const ZOOM_DEFAUT=2.8;
function cadre(fond){return fond.viewBox.split(/\s+/).map(Number);}
function loupeVB(fond,cx,cy){
  const zoom=fond.zoom||ZOOM_DEFAUT;
  const [x0,y0,w,h]=cadre(fond), nw=w/zoom, nh=h/zoom;
  const x=Math.max(x0,Math.min(x0+w-nw,cx-nw/2)), y=Math.max(y0,Math.min(y0+h-nh,cy-nh/2));
  return `${x.toFixed(1)} ${y.toFixed(1)} ${nw.toFixed(1)} ${nh.toFixed(1)}`;
}
function cadreSur(fond,id){
  const z=fond.zones.find(v=>v.id===id);
  return z?loupeVB(fond,z.cx,z.cy):fond.viewBox;
}
/* convertit un clic en coordonnees du viewBox courant */
function pointCarte(svg,ev){
  const r=svg.getBoundingClientRect(), [x0,y0,w,h]=(svg.getAttribute("viewBox")).split(/\s+/).map(Number);
  return [x0+(ev.clientX-r.left)/r.width*w, y0+(ev.clientY-r.top)/r.height*h];
}
/* renvoie le cadre nomme de `fond.cadres` qui contient le point (x,y), ou null.
   Sert au planisphere : un premier appui hors de tout cadre ne fait rien, un
   appui dedans ouvre ce cadre pour le second appui qui designe le territoire. */
function cadreNomme(fond,x,y){
  if(!fond.cadres)return null;
  for(const c of fond.cadres){
    const [cx0,cy0,cw,ch]=c.vb.split(/\s+/).map(Number);
    if(x>=cx0&&x<=cx0+cw&&y>=cy0&&y<=cy0+ch)return c;
  }
  return null;
}
/* branche les gestionnaires de clic et de clavier sur une carte deja rendue */
function mapBrancher(hote,repondre){
  hote.querySelectorAll(".z").forEach(g=>{
    g.onclick=()=>repondre(g.dataset.z);
    g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();repondre(g.dataset.z);}};
  });
}

/* ============ donnees ============ */
/* Traces reels, Natural Earth 50m, simplifies puis figes ici (domaine public,
   aucune attribution requise). Le site reste sans dependance et sans acces

const SHEET_URL="https://script.google.com/macros/s/AKfycbwB53nfh6Xk_z1Gn4ck_WL8aX0gPxDzQ2MpxWVnpsdunmWR_IKj-tHPHOEVkP614jQJ/exec";
function logResult(game,score,good,total,secs){
  try{fetch(SHEET_URL,{method:"POST",mode:"no-cors",body:JSON.stringify({page:"geo-europe",game,score,good,total,secs})});}catch(e){}
}
const CHEERS=[["🎉","Bravo !"],["⭐","Super !"],["🚀","Excellent !"],["🏆","Champion !"],["🗺️","Pile au bon endroit !"],["🔥","Trop fort !"],["🌟","Génial !"],["🧭","Bien orientée !"]];
const OOPS=[["😅","Oups, presque !"],["🙈","Pas cette fois !"],["🤔","Hmm, regarde la carte..."],["🐢","On y va doucement !"],["🧐","Presque ! Lis la correction."]];
function confetti(host){
  const cols=["#e63946","#f4a261","#2a9d8f","#457b9d","#ffd166","#9b5de5","#06d6a0"];
  for(let i=0;i<22;i++){
    const p=document.createElement("i");p.className="confetti";
    const ang=Math.random()*Math.PI*2, d=60+Math.random()*90;
    p.style.setProperty("--dx",Math.cos(ang)*d+"px");
    p.style.setProperty("--dy",(Math.sin(ang)*d-40)+"px");
    p.style.background=rnd(cols);
    p.style.animationDelay=(Math.random()*.15)+"s";
    host.appendChild(p);
  }
}
function showVerdict(ok,sel,st){
  const v=$(sel);
  const [emo,msg]=ok?rnd(CHEERS):rnd(OOPS);
  st.streak=ok?st.streak+1:0;
  v.className="react "+(ok?"yes":"no");
  v.innerHTML=`<span class="emo" role="img" aria-label="${ok?"Bonne réponse":"Mauvaise réponse"}">${emo}</span><span class="msg">${msg}</span>`+
    (st.streak>=3?`<span class="streak">🔥 ${st.streak} d'affilée !</span>`:"");
  if(ok)confetti(v);
}
function bilanHTML(st,titreOk){
  const good=st.list.length-st.errs.length;
  return `<div class="bilan">
    <h2>${good===st.list.length?"🏆 Sans faute, incroyable !":good>=st.list.length*.8?"🌟 Bravo, belle manche !":good>=st.list.length/2?"👍 Pas mal du tout !":"💪 Continue, tu progresses !"}</h2>
    <p class="bigscore">${st.score}</p>
    <p class="meta">${good} bonnes réponses sur ${st.list.length}, en ${chrono(st.secs)}.</p>
    ${st.errs.length?`<p class="section-title">À revoir</p><ul class="errlist">${st.errs.map(e=>`
      <li><span class="rep">${e.rep}</span> ${e.w}</li>`).join("")}</ul>`
    :`<p class="section-title">Sans faute</p><p style="margin-top:8px">${titreOk}</p>`}
    <div class="row-end"><button class="btn ghost" id="again">Nouvelle manche</button></div>
  </div>`;
}

/* onglets */
document.querySelectorAll(".tab").forEach(t=>{
  t.addEventListener("click",()=>{
    document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===t));
    document.querySelectorAll(".panel").forEach(p=>p.classList.toggle("on",p.id===t.dataset.panel));
    if(t.dataset.panel==="placer")plaIntro();
    if(t.dataset.panel==="nommer")nomIntro();
    if(t.dataset.panel==="membre")memIntro();
    if(t.dataset.panel==="voisins")voiIntro();
    window.scrollTo({top:0,behavior:"smooth"});
  });
});
/* ============ 1. placer ============ */
const P={list:[],i:0,score:0,errs:[],t0:0,streak:0,secs:0,vb:null};
const pp=$("#placer");
function plaIntro(){
  pp.innerHTML=`<div class="intro">
    <h2>Place les pays de l'Union</h2>
    <p>Douze pays parmi les vingt-sept, dans le désordre. On te donne un nom : touche d'abord l'endroit où tu penses qu'il se trouve, la carte se resserre autour de ton doigt, puis désigne le pays lui-même. « Vue d'ensemble » permet de ressortir sans répondre.</p>
    <button class="btn" id="pgo">Commencer la manche</button>
  </div>`;
  $("#pgo").onclick=plaStart;
}
function plaStart(){
  P.list=pick(UE,12);P.i=0;P.score=0;P.errs=[];P.streak=0;P.t0=Date.now();plaStep();
}
/* Manche jouee en deux appuis, voir la note sur la loupe en tete du fichier :
   P.vb vaut null en vue d'ensemble, sinon le viewBox resserre par loupeVB. */
function plaStep(){
  if(P.i>=P.list.length)return plaEnd();
  const q=P.list[P.i];
  P.vb=null;
  pp.innerHTML=`
    <div class="status"><span>Pays <b>${P.i+1}</b>/${P.list.length}</span><span class="grow"></span><span>Points <b id="psc">${P.score}</b></span></div>
    <div id="pcard">
      <div class="react" id="pv"></div>
      <p class="annot" id="pan">Touche l'endroit où tu penses qu'il se trouve</p>
      <p class="hyp enonce">${esc(q.nom)}</p>
      <div class="fig"><div id="afig"></div><button class="btn ghost retour hidden" id="aretour" type="button">Vue d'ensemble</button></div>
      <p class="why" id="pwhy"></p>
    </div>
    <div class="row-end"><button class="btn hidden" id="pnext">Suivant</button></div>`;
  const fig=$("#afig");
  const svg=()=>fig.querySelector("svg");
  function dessiner(){
    fig.innerHTML=mapSVG(FOND_EUROPE,P.vb?{vb:P.vb}:{});
    if(P.vb){
      mapBrancher(fig,repondre);                       /* zoome : on repond */
    }else{
      svg().onclick=ev=>{                              /* vue d'ensemble : on zoome */
        const [x,y]=pointCarte(svg(),ev);
        P.vb=loupeVB(FOND_EUROPE,x,y);
        dessiner();
      };
    }
    $("#aretour").classList.toggle("hidden",!P.vb);
    $("#pan").textContent=P.vb?"Désigne le pays":"Touche l'endroit où tu penses qu'il se trouve";
  }
  $("#aretour").onclick=()=>{P.vb=null;dessiner();};
  function repondre(id){
    const ok=id===q.id;
    const clique=PAYS.find(p=>p.id===id);
    if(ok)P.score+=10;else P.errs.push({rep:q.nom,w:`Tu avais désigné ${clique?clique.nom:"un autre endroit"}.`});
    P.vb=null;
    /* retour en vue d'ensemble pour montrer la bonne reponse dans son contexte europeen */
    fig.innerHTML=mapSVG(FOND_EUROPE,{bonne:q.id,choisie:id,etiquettes:true});
    $("#aretour").classList.add("hidden");
    $("#pan").textContent="Voici où il se trouve";
    showVerdict(ok,"#pv",P);
    $("#pcard").classList.add("revealed");
    $("#pwhy").innerHTML=ok?`C'est bien <b>${esc(q.nom)}</b>.`:`<em>Non, ça c'était ${esc(clique?clique.nom:"ailleurs")}. </em>C'était <b>${esc(q.nom)}</b>.`;
    $("#psc").textContent=P.score;
    const n=$("#pnext");n.classList.remove("hidden");
    n.textContent=P.i===P.list.length-1?"Voir le bilan":"Suivant";
    n.onclick=()=>{P.i++;plaStep();};
    n.focus({preventScroll:true});
  }
  dessiner();
}
function plaEnd(){
  P.secs=Math.round((Date.now()-P.t0)/1000);
  logResult("placer",P.score,P.list.length-P.errs.length,P.list.length,P.secs);
  pp.innerHTML=bilanHTML(P,"Douze pays de l'Union bien placés. Passe à Reconnaître.");
  $("#again",pp).onclick=plaStart;
}

/* ============ 2. reconnaitre ============ */
const N={list:[],i:0,score:0,errs:[],t0:0,streak:0,secs:0};
const np=$("#nommer");
function voisinsDe(p,n){
  return PAYS.filter(x=>x!==p&&x.ue)
    .map(x=>({x,d:Math.hypot(x.cx-p.cx,x.cy-p.cy)}))
    .sort((a,b)=>a.d-b.d).slice(0,n).map(o=>o.x);
}
function nomIntro(){
  np.innerHTML=`<div class="intro">
    <h2>Reconnais le pays</h2>
    <p>Douze pays de l'Union. Cette fois le pays est surligné sur la carte, à toi de dire son nom. Les propositions sont ses voisins : regarde bien la forme et la position.</p>
    <button class="btn" id="ngo">Commencer la manche</button>
  </div>`;
  $("#ngo").onclick=nomStart;
}
function nomStart(){
  N.list=pick(UE,12);N.i=0;N.score=0;N.errs=[];N.streak=0;N.t0=Date.now();nomStep();
}
/* le cadre se resserre sur le pays surligne, sinon Malte ne s'y voit meme pas */
function nomStep(){
  if(N.i>=N.list.length)return nomEnd();
  const q=N.list[N.i];
  const props=shuffle([q,...pick(voisinsDe(q,5),3)]);
  np.innerHTML=`
    <div class="status"><span>Pays <b>${N.i+1}</b>/${N.list.length}</span><span class="grow"></span><span>Points <b id="nsc">${N.score}</b></span></div>
    <div id="ncard">
      <div class="react" id="nv"></div>
      <p class="annot">Quel est ce pays ?</p>
      <div class="fig">${mapSVG(FOND_EUROPE,{surligne:q.id,vb:cadreSur(FOND_EUROPE,q.id)})}</div>
      <div class="choices">${props.map((p,i)=>`<button class="choice" data-i="${i}">${esc(p.nom)}</button>`).join("")}</div>
      <p class="why" id="nwhy"></p>
    </div>
    <div class="row-end"><button class="btn hidden" id="nnext">Suivant</button></div>`;
  np.querySelectorAll(".choice").forEach((b,i)=>{
    b.onclick=()=>{
      const ok=props[i]===q;
      if(ok)N.score+=10;else N.errs.push({rep:q.nom,w:"Revois sa position sur la carte."});
      np.querySelectorAll(".choice").forEach((x,j)=>{
        x.disabled=true;
        if(props[j]===q)x.classList.add("good");
        else if(j===i)x.classList.add("bad");
        else x.classList.add("dim");
      });
      showVerdict(ok,"#nv",N);
      $("#ncard").classList.add("revealed");
      $("#nwhy").innerHTML=`C'était <b>${esc(q.nom)}</b>.`;
      $("#nsc").textContent=N.score;
      const n=$("#nnext");n.classList.remove("hidden");
      n.textContent=N.i===N.list.length-1?"Voir le bilan":"Suivant";
      n.onclick=()=>{N.i++;nomStep();};
      n.focus({preventScroll:true});
    };
  });
}
function nomEnd(){
  N.secs=Math.round((Date.now()-N.t0)/1000);
  logResult("nommer",N.score,N.list.length-N.errs.length,N.list.length,N.secs);
  np.innerHTML=bilanHTML(N,"Tu les reconnais. Va voir qui est vraiment dans l'Union.");
  $("#again",np).onclick=nomStart;
}

/* ============ 3. dans l'UE ? ============ */
const U={list:[],i:0,score:0,errs:[],t0:0,streak:0,secs:0};
const up=$("#membre");
function memIntro(){
  up.innerHTML=`<div class="intro">
    <h2>Dans l'Union, ou pas ?</h2>
    <p>Douze pays, six membres et six non-membres, dans le désordre. Le pays est surligné : réponds oui ou non. Attention au Royaume-Uni, à la Suisse et à la Norvège, qui sont en Europe sans être dans l'Union.</p>
    <button class="btn" id="ugo">Commencer la manche</button>
  </div>`;
  $("#ugo").onclick=memStart;
}
function memStart(){
  U.list=shuffle([...pick(PAYS.filter(p=>p.ue),6),...pick(PAYS.filter(p=>!p.ue),6)]);
  U.i=0;U.score=0;U.errs=[];U.streak=0;U.t0=Date.now();memStep();
}
/* la carte reste ici sans montrerUE : la couleur ne doit jamais trahir la reponse */
function memStep(){
  if(U.i>=U.list.length)return memEnd();
  const q=U.list[U.i];
  up.innerHTML=`
    <div class="status"><span>Pays <b>${U.i+1}</b>/${U.list.length}</span><span class="grow"></span><span>Points <b id="usc">${U.score}</b></span></div>
    <div id="ucard">
      <div class="react" id="uv"></div>
      <p class="annot" id="uan">Ce pays est-il membre de l'Union européenne ?</p>
      <p class="hyp enonce">${esc(q.nom)}</p>
      <div class="fig">${mapSVG(FOND_EUROPE,{surligne:q.id,vb:cadreSur(FOND_EUROPE,q.id)})}</div>
      <p class="why" id="uwhy"></p>
    </div>
    <div class="judge"><button class="btn" data-v="1">Oui</button><button class="btn no" data-v="0">Non</button></div>
    <div class="row-end"><button class="btn hidden" id="unext">Suivant</button></div>`;
  up.querySelectorAll(".judge .btn").forEach(b=>{
    b.onclick=()=>{
      const ok=(b.dataset.v==="1")===q.ue;
      if(ok)U.score+=10;
      else U.errs.push({rep:q.nom,w:q.ue?"Il est bien membre de l'Union européenne.":q.w});
      up.querySelectorAll(".judge .btn").forEach(x=>{
        x.disabled=true;
        if((x.dataset.v==="1")===q.ue)x.classList.add("good");
        else if(x===b)x.classList.add("bad");
        else x.classList.add("dim");
      });
      showVerdict(ok,"#uv",U);
      $("#ucard").classList.add("revealed");
      $("#uan").textContent=q.ue?`${q.nom} : membre de l'Union`:`${q.nom} : hors de l'Union`;
      $("#uwhy").innerHTML=q.ue?"Il fait partie des vingt-sept.":esc(q.w);
      $("#usc").textContent=U.score;
      const n=$("#unext");n.classList.remove("hidden");
      n.textContent=U.i===U.list.length-1?"Voir le bilan":"Suivant";
      n.onclick=()=>{U.i++;memStep();};
      n.focus({preventScroll:true});
    };
  });
}
function memEnd(){
  U.secs=Math.round((Date.now()-U.t0)/1000);
  logResult("membre",U.score,U.list.length-U.errs.length,U.list.length,U.secs);
  up.innerHTML=bilanHTML(U,"Tu ne confonds plus l'Europe et l'Union. Reste les voisins de la France.");
  $("#again",up).onclick=memStart;
}

/* ============ 4. les voisins de la France ============ */
const V={list:[],i:0,score:0,errs:[],t0:0,streak:0,secs:0};
const vp=$("#voisins");
const VOISINS=[
 {id:"be",w:"Elle borde le nord de la France, des Hauts-de-France au Grand Est."},
 {id:"lu",w:"Le plus petit des voisins, coincé entre la Belgique et l'Allemagne."},
 {id:"de",w:"Elle borde le Grand Est, de l'autre côté du Rhin."},
 {id:"ch",w:"Elle borde la Bourgogne-Franche-Comté et l'Auvergne-Rhône-Alpes."},
 {id:"it",w:"Elle borde l'Auvergne-Rhône-Alpes et Provence-Alpes-Côte d'Azur, par les Alpes."},
 {id:"es",w:"Elle borde la Nouvelle-Aquitaine et l'Occitanie, par les Pyrénées."},
 {id:"gb",w:"Il n'a pas de frontière terrestre avec la France : il lui fait face de l'autre côté de la Manche."}
].map(v=>({...PAYS.find(p=>p.id===v.id),w:v.w}));
function voiIntro(){
  vp.innerHTML=`<div class="intro">
    <h2>Les voisins de la France</h2>
    <p>Sept pays entourent la France sur la carte. Clique celui qu'on te nomme. Les pays qui ne sont pas dans l'Union sont en gris : ici, ça n'a pas d'importance.</p>
    <button class="btn" id="vgo">Commencer la manche</button>
  </div>`;
  $("#vgo").onclick=voiStart;
}
function voiStart(){
  V.list=shuffle(VOISINS);V.i=0;V.score=0;V.errs=[];V.streak=0;V.t0=Date.now();voiStep();
}
function voiStep(){
  if(V.i>=V.list.length)return voiEnd();
  const q=V.list[V.i];
  vp.innerHTML=`
    <div class="status"><span>Voisin <b>${V.i+1}</b>/${V.list.length}</span><span class="grow"></span><span>Points <b id="vsc">${V.score}</b></span></div>
    <div id="vcard">
      <div class="react" id="vv"></div>
      <p class="annot" id="van">Clique sur ce voisin de la France</p>
      <p class="hyp enonce">${esc(q.nom)}</p>
      <div class="fig" id="vfig">${mapSVG(FOND_EUROPE,{surligne:"fr",montrerUE:true})}</div>
      <p class="why" id="vwhy"></p>
    </div>
    <div class="row-end"><button class="btn hidden" id="vnext">Suivant</button></div>`;
  mapBrancher($("#vfig"),id=>{
    const ok=id===q.id;
    const clique=PAYS.find(p=>p.id===id);
    if(ok)V.score+=10;else V.errs.push({rep:q.nom,w:q.w});
    $("#vfig").innerHTML=mapSVG(FOND_EUROPE,{bonne:q.id,choisie:id,etiquettes:true,montrerUE:true});
    showVerdict(ok,"#vv",V);
    $("#vcard").classList.add("revealed");
    $("#van").textContent=q.nom;
    $("#vwhy").innerHTML=(ok?"":`<em>Non, ça c'était ${esc(clique.nom)}. </em>`)+q.w;
    $("#vsc").textContent=V.score;
    const n=$("#vnext");n.classList.remove("hidden");
    n.textContent=V.i===V.list.length-1?"Voir le bilan":"Suivant";
    n.onclick=()=>{V.i++;voiStep();};
    n.focus({preventScroll:true});
  });
}
function voiEnd(){
  V.secs=Math.round((Date.now()-V.t0)/1000);
  logResult("voisins",V.score,V.list.length-V.errs.length,V.list.length,V.secs);
  vp.innerHTML=bilanHTML(V,"La France et ses sept voisins, c'est acquis.");
  $("#again",vp).onclick=voiStart;
}

plaIntro();
</script>
