<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Les carnets d'entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5F6F1;
  --paper-2:#FCFCFA;
  --rule:#BFD3E4;
  --rule-soft:#DDE7F0;
  --marge:#DE5B4A;
  --ink:#16233B;
  --ink-soft:#5E6E85;
  --francais:#1D4E89;
  --maths:#1B6F55;
  --histoire:#8C4A2F;
  --geo:#17697B;
  --serif:"Instrument Serif", Georgia, "Times New Roman", serif;
  --sans:"Karla", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  min-height:100vh;
  padding:0 0 40px;
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}

/* ---------- en-tete ---------- */
header{padding:26px 0 14px}
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ink-soft);font-weight:700;margin:0 0 6px
}
h1{
  font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.05;
  margin:0 0 4px;letter-spacing:-.01em
}
h1 em{font-style:italic;color:var(--francais)}
.sub{margin:0;color:var(--ink-soft);font-size:14px;max-width:44ch}

/* ---------- feuille ---------- */
.sheet{
  position:relative;background:var(--paper-2);
  border:1px solid var(--rule);border-radius:10px;
  padding:22px 16px 20px 30px;overflow:hidden;margin-top:20px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--rule-soft) 31px 32px);
  background-position:0 8px;
}
.sheet::before{
  content:"";position:absolute;top:0;bottom:0;left:20px;width:1px;background:var(--marge);opacity:.5
}

/* ---------- matieres ---------- */
.cards{display:grid;gap:12px;margin:0}
.card{
  display:flex;align-items:center;gap:12px;position:relative;
  text-decoration:none;color:inherit;
  border:1px solid var(--rule);border-left:3px solid var(--c);
  background:var(--paper-2);border-radius:8px;
  padding:22px 18px;
  transition:border-color .15s,box-shadow .15s,transform .15s
}
.card:hover{border-color:var(--c);box-shadow:0 2px 0 var(--c);transform:translateY(-1px)}
.card h2{
  font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.1;
  margin:0;letter-spacing:-.005em;color:var(--c);flex:1
}
.card .go{
  font-family:var(--serif);font-size:24px;line-height:1;color:var(--c);
  transition:transform .15s
}
.card:hover .go{transform:translateX(3px)}

@media (max-width:420px){
  h1{font-size:29px}
  .sheet{padding-left:26px}
  .card h2{font-size:26px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">Révisions, 3<sup>e</sup></p>
    <h1>Les carnets <em>d'entraînement</em></h1>
    <p class="sub">Choisis ta matière.</p>
  </header>

  <div class="sheet">
    <div class="cards">

      <a class="card" style="--c:var(--francais)" href="francais.html">
        <h2>Français</h2>
        <span class="go">&rarr;</span>
      </a>

      <a class="card" style="--c:var(--maths)" href="maths.html">
        <h2>Maths</h2>
        <span class="go">&rarr;</span>
      </a>

      <a class="card" style="--c:var(--histoire)" href="histoire.html">
        <h2>Histoire</h2>
        <span class="go">&rarr;</span>
      </a>

      <a class="card" style="--c:var(--geo)" href="geographie.html">
        <h2>G&eacute;ographie</h2>
        <span class="go">&rarr;</span>
      </a>

    </div>
  </div>
</div>
</body>
</html>
